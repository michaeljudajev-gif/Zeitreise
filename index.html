<script>
'use strict';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const modal = document.getElementById('modal');
const panel = document.getElementById('panel');

const W = 1120;
const H = 630;
const FLOOR = 521;
const WORLD = 7400;

const GATE_X = Array.from(
  {length:10},
  (_,i) => 690+i*625
);

const endX = 7040;

const verbs = [
  ['gehen','ging','ist gegangen','war gegangen'],
  ['machen','machte','hat gemacht','hatte gemacht'],
  ['sehen','sah','hat gesehen','hatte gesehen'],
  ['kommen','kam','ist gekommen','war gekommen'],
  ['finden','fand','hat gefunden','hatte gefunden'],
  ['lernen','lernte','hat gelernt','hatte gelernt'],
  ['essen','aß','hat gegessen','hatte gegessen'],
  ['schreiben','schrieb','hat geschrieben','hatte geschrieben'],
  ['fahren','fuhr','ist gefahren','war gefahren'],
  ['sprechen','sprach','hat gesprochen','hatte gesprochen']
];

const forms = [
  '',
  'Präteritum',
  'Perfekt',
  'Plusquamperfekt'
];

const explanations = [
  [
    'Präteritum',
    'Das Präteritum erzählt von der Vergangenheit. Man findet es oft in Geschichten: „Er ging nach Hause.“ Die Verben sein, haben und Modalverben stehen auch im Gespräch häufig im Präteritum.'
  ],
  [

    'Das Perfekt ist in Gesprächen sehr häufig: „Ich habe gelernt.“ Es besteht aus haben oder sein und Partizip II. Bei vielen Bewegungsverben verwendet man sein: „Ich bin gegangen.“'
  ],
  [
    'Plusquamperfekt',
    'Das Plusquamperfekt beschreibt etwas, das vor einem anderen vergangenen Ereignis passiert war: „Nachdem ich gegessen hatte, ging ich schlafen.“ Bildung: hatte oder war + Partizip II.'
  ],
  [
    'Lerntipp',
    'Lerne die Formen zusammen: gehen – ging – ist gegangen – war gegangen. Schreibe eigene Beispielsätze und wiederhole schwierige Verben nach einem Tag, drei Tagen und einer Woche.'
  ]
];

const translations = {
  en: [
    'The simple past often appears in written stories: „Er ging nach Hause.“ The verbs sein, haben and modal verbs are also common in the simple past in speech.',
    'The present perfect is common in conversation. It uses haben or sein plus the past participle. Many movement verbs use sein.',
    'The past perfect describes an event that happened before another past event. Formation: hatte or war + past participle.',
    'Learn forms together, write example sentences and review after one day, three days and one week.'
  ],
  ru: [
    'Präteritum часто встречается в рассказах о прошлом. Sein, haben и модальные глаголы нередко используются так и в разговорной речи.',
    'Perfekt часто используется в разговоре. Он образуется с haben или sein и Partizip II. Многие глаголы движения используют sein.',
    'Plusquamperfekt обозначает действие, произошедшее раньше другого события в прошлом: hatte или war + Partizip II.',
    'Учите формы вместе, составляйте примеры и повторяйте через день, три дня и неделю.'
  ],
  uk: [
    'Präteritum часто вживається в розповідях про минуле. Sein, haben і модальні дієслова також часто використовуються в цій формі в розмові.',
    'Perfekt часто використовується в розмові. Він утворюється за допомогою haben або sein та Partizip II.',
    'Plusquamperfekt описує дію, що відбулася раніше за іншу минулу подію: hatte або war + Partizip II.',
    'Вивчайте форми разом, складайте речення та повторюйте через день, три дні й тиждень.'
  ],
  mk: [
    'Präteritum често се користи во раскази за минатото. Sein, haben и модалните глаголи често се користат така и во говорот.',
    'Perfekt е чест во разговорот. Се образува со haben или sein и Partizip II.',
    'Plusquamperfekt означува дејство пред друго минато дејство: hatte или war + Partizip II.',
    'Учете ги формите заедно, пишувајте примери и повторувајте по еден ден, три дена и една недела.'
  ],
  fr: [
    'Le Präteritum est fréquent dans les récits. Sein, haben et les verbes modaux sont aussi souvent employés ainsi à l’oral.',
    'Le Perfekt est fréquent à l’oral : haben ou sein + participe passé. De nombreux verbes de déplacement utilisent sein.',
    'Le Plusquamperfekt exprime une action antérieure à une autre action passée : hatte ou war + Partizip II.',
    'Apprenez les formes ensemble, écrivez des exemples et révisez après un jour, trois jours et une semaine.'
  ],
  tr: [
    'Präteritum geçmiş olayları anlatan hikâyelerde sık görülür. Sein, haben ve modal fiiller konuşmada da bu biçimde kullanılır.',
    'Perfekt konuşmada yaygındır: haben veya sein + Partizip II. Birçok hareket fiili sein kullanır.',
    'Plusquamperfekt başka bir geçmiş olaydan daha önce gerçekleşen eylemi anlatır: hatte veya war + Partizip II.',
    'Biçimleri birlikte öğrenin, örnek cümleler yazın ve bir, üç, yedi gün sonra tekrar edin.'
  ]
};

let state = null;
let mode = 'easy';

let keys = {
  left:false,
  right:false,
  jump:false
};

let previous = 0;
let raf = 0;
let questionStart = 0;
let typingTimer = 0; 
// ==========================================
// TEIL 2 – GRAFIK UND SPIELWELT
// ==========================================

function rnd(n) {
  let v = Math.sin(n*127.1+41.73)*43758.5453;
  return v-Math.floor(v);
}

function rect(x,y,w,h,c) {
  ctx.fillStyle=c;
  ctx.fillRect(x,y,w,h);
}

function circle(x,y,r,c) {
  ctx.fillStyle=c;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

function stroke(x,y,x2,y2,c,w=2) {
  ctx.strokeStyle=c;
  ctx.lineWidth=w;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

function poly(points,c) {
  ctx.fillStyle=c;
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  points.slice(1).forEach(p=>ctx.lineTo(...p));
  ctx.closePath();
  ctx.fill();
}

function round(x,y,w,h,r,c) {
  ctx.fillStyle=c;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}

function text(s,x,y,size=18,c='#fff',align='center') {
  ctx.textAlign=align;
  ctx.font=`900 ${size}px Georgia`;
  ctx.lineWidth=3;
  ctx.strokeStyle='#1b253580';
  ctx.strokeText(s,x,y);
  ctx.fillStyle=c;
  ctx.fillText(s,x,y);
}

function drawCloud(x,y,s) {
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);
  circle(-35,4,26,'#ffffffb8');
  circle(-10,-12,36,'#ffffffd9');
  circle(26,-2,30,'#ffffffce');
  circle(50,8,21,'#ffffffb8');
  ctx.restore();
}

function mountain(x,y,s,c) {
  poly([
    [x-230*s,H],
    [x,y],
    [x+250*s,H]
  ],c);

  poly([
    [x-47*s,y+55*s],
    [x,y],
    [x+55*s,y+70*s],
    [x+15*s,y+59*s],
    [x-13*s,y+83*s]
  ],'#f3f8edb0');
}

function tree(x,y,s=1) {
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);

  rect(-9,-96,18,96,'#745038');

  for(let i=0;i<8;i++) {
    let a=i*Math.PI*2/8;

    circle(
      Math.cos(a)*35,
      -111+Math.sin(a)*24,
      32,
      i%2?'#3b965d':'#4ca96a'
    );
  }

  circle(0,-130,40,'#63b879');
  ctx.restore();
}

function cottage(x,y,seed=0,s=1) {
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);

  let w=235,h=202;

  rect(-w/2,-h,w,h,'#674833');
  rect(-w/2+8,-h+8,w-16,h-16,'#f2d6a0');

  for(let i=0;i<4;i++) {
    rect(-w/2+12+i*58,-h+9,6,h-19,'#795338');
  }

  stroke(
    -w/2+7,-h+10,
    w/2-7,-13,
    '#95603a',8
  );

  stroke(
    w/2-7,-h+10,
    -w/2+7,-13,
    '#95603a',8
  );

  poly([
    [-143,-h+9],
    [0,-h-95],
    [143,-h+9]
  ],'#713d32');

  poly([
    [-143,-h+9],
    [0,-h-95],
    [143,-h+9],
    [125,-h+9],
    [0,-h-73],
    [-125,-h+9]
  ],'#ba5c40');

  for(let row=0;row<5;row++) {
    for(let j=0;j<8-row%2;j++) {
      let px=-125+j*34+(row%2)*15;

      stroke(
        px,-h-2-row*15,
        px+27,-h-2-row*15,
        '#e38856',3
      );
    }
  }

  rect(-84,-h+38,52,65,'#724b35');
  rect(-77,-h+45,38,50,'#8ed2df');
  stroke(-58,-h+45,-58,-h+95,'#f8e3b5',5);

  rect(35,-h+38,52,65,'#724b35');
  rect(42,-h+45,38,50,'#8ed2df');
  stroke(61,-h+45,61,-h+95,'#f8e3b5',5);

  rect(-31,-94,62,94,'#774830');
  rect(-24,-88,48,88,'#a36743');
  circle(14,-45,4,'#f6d28d');

  rect(-w/2,-20,w,20,'#a9794c');

  for(let i=0;i<9;i++) {
    circle(
      -95+i*24,-103,7,
      i%2?'#f4a33b':'#f26969'
    );

    circle(-95+i*24,-114,5,'#4eab5b');
  }

  ctx.restore();
}

function market(x,y) {
  ctx.save();
  ctx.translate(x,y);

  rect(-95,-103,12,103,'#77513a');
  rect(80,-103,12,103,'#77513a');

  poly([
    [-118,-107],
    [-86,-157],
    [83,-157],
    [116,-107]
  ],'#efcda4');

  for(let i=0;i<7;i++) {
    poly([
      [-118+i*33,-107],
      [-86+i*28,-157],
      [-58+i*28,-157],
      [-84+i*33,-107]
    ],i%2?'#fff0c8':'#c85550');
  }

  rect(-103,-26,210,26,'#825039');

  for(let i=0;i<10;i++) {
    circle(
      -78+i*18,-36,9,
      i%2?'#ed7e33':'#e9bc46'
    );
  }

  ctx.restore();
}

function platform(x,y,w) {
  rect(x,y,w,24,'#705037');
  rect(x,y,w,8,'#cda56b');

  for(let i=0;i<w/34;i++) {
    rect(
      x+i*34,y+8,31,14,
      i%2?'#8d6242':'#a47750'
    );

    stroke(
      x+i*34,y+10,
      x+i*34,y+20,
      '#563d2c',1
    );
  }

  for(let i=0;i<w/30;i++) {
    circle(
      x+10+i*30,y-2,8,
      i%2?'#79bb62':'#62a95d'
    );
  }
}

function world() {
  let cam=state?.cam||0;
  let t=state?.time||0;

  let sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#55b9ec');
  sky.addColorStop(.68,'#b9e6f6');
  sky.addColorStop(1,'#f9e5a8');

  rect(0,0,W,H,sky);
  circle(880,115,58,'#fff1b2');

  // Wolken: langsame Parallax-Ebene
  for(let i=0;i<19;i++) {
    let x=(i*235-cam*.12)%(W+450);
    if(x< -160)x+=W+450;

    drawCloud(
      x,
      85+(i%5)*34,
      .6+rnd(i)*.8
    );
  }

  // Berge
  for(let i=0;i<12;i++) {
    let x=i*350-cam*.18;

    mountain(
      x,
      315+rnd(i)*90,
      .8+rnd(i+4)*.4,
      i%2?'#84b5c3':'#9cc8c9'
    );
  }

  // Hügel
  for(let i=0;i<13;i++) {
    let x=i*240-cam*.38;

    circle(
      x,465,165,
      i%2?'#72ac8e':'#83b99a'
    );
  }

  // Bäume
  for(let i=0;i<31;i++) {
    let x=i*210-cam*.68;

    if(x>-120&&x<W+120) {
      tree(
        x,519,
        .65+rnd(i+6)*.45
      );
    }
  }

  // Dorfgebäude
  for(let i=0;i<17;i++) {
    let x=170+i*440-cam;

    if(x>-230&&x<W+230) {
      cottage(
        x,507,i,
        .76+(i%3)*.13
      );

      if(i%3===1) {
        market(x+205,510);
      }
    }
  }

  // Gras und Steinweg
  rect(0,FLOOR,W,H-FLOOR,'#6b9b57');
  rect(0,FLOOR,W,15,'#b8c579');
  rect(0,FLOOR+17,W,10,'#9f7a4f');

  for(
    let i=Math.floor(cam/45)-1;
    i<Math.ceil((cam+W)/45)+1;
    i++
  ) {
    let x=i*45-cam;

    round(
      x+3,FLOOR+28,41,30,4,
      i%2?'#bca079':'#d0b48c'
    );

    stroke(
      x+3,FLOOR+58,
      x+42,FLOOR+58,
      '#80674c',2
    );

    if(i%3===0) {
      circle(x+8,FLOOR-4,4,'#f8c9da');
      circle(x+11,FLOOR-11,3,'#fce3aa');
    }
  }
}

function coin(x,y,t) {
  let xx=x-state.cam;

  if(xx<-30||xx>W+30)return;

  let bob=Math.sin(t*3+x)*5;

  circle(xx,y+bob,16,'#9b5b0e');
  circle(xx,y+bob,13,'#ffdc4b');
  circle(xx,y+bob,9,'#e7a72d');

  text('✦',xx,y+5+bob,16,'#fff2a5');
}

function gate(x,i) {
  let xx=x-state.cam;

  if(xx<-90||xx>W+90)return;

  let open=i<state.gate;
  let y=FLOOR;

  rect(xx-49,y-150,17,150,'#5d5067');
  rect(xx+32,y-150,17,150,'#5d5067');
  rect(xx-58,y-162,116,20,'#c99a5a');

  poly([
    [xx-67,y-162],
    [xx,y-232],
    [xx+67,y-162]
  ],'#8c4e48');

  poly([
    [xx-52,y-166],
    [xx,y-215],
    [xx+52,y-166]
  ],'#c56b4b');

  rect(
    xx-30,y-140,60,140,
    open?'#5fc7a2':'#353e70'
  );

  if(!open) {
    circle(xx,y-73,24,'#8b80c9');
    text('◆',xx,y-64,25,'#fce69d');
  } else {
    text('✓',xx,y-72,47,'#e5ffb8');
  }

  text('TOR '+(i+1),xx,y-177,18,'#fff3c3');
}

function hero(x,y,t,dir) {
  ctx.save();
  ctx.translate(x-state.cam,y);
  ctx.scale(dir,1);

  let swing=
    Math.sin(t*12)*10*
    (Math.abs(state.vx)>20?1:.15);

  // Kopf und Gesicht
  circle(0,-56,22,'#f6c5a2');
  circle(-8,-61,3,'#3d2c3c');
  circle(7,-61,3,'#3d2c3c');

  // Haare
  poly([
    [-26,-72],
    [-16,-93],
    [1,-82],
    [14,-96],
    [23,-75],
    [9,-82],
    [-5,-78]
  ],'#aa3846');

  // Umhang
  poly([
    [-17,-32],
    [-43,-13],
    [-26,-4],
    [-12,-16]
  ],'#d44d4e');

  // Kleidung
  rect(-20,-35,40,39,'#285b96');
  rect(-21,-10,42,10,'#c5a257');

  // Beine
  stroke(
    -9,3,-12+swing,23,
    '#493f49',12
  );

  stroke(
    9,3,12-swing,23,
    '#493f49',12
  );

  // Arme
  stroke(
    -15,-28,-23+swing*.5,-5,
    '#f5bc95',10
  );

  stroke(
    15,-28,22-swing*.5,-7,
    '#f5bc95',10
  );

  ctx.restore();
}

function sceneryExtras() {
  let cam=state.cam;

  // Zäune
  for(let i=0;i<12;i++) {
    let x=420+i*590-cam;

    if(x>-100&&x<W+100) {
      rect(
        x-70,FLOOR-42,
        140,10,'#6f5239'
      );

      for(let j=0;j<6;j++) {
        rect(
          x-64+j*24,
          FLOOR-63,
          8,28,
          '#8b6440'
        );
      }
    }
  }

  // Plattformen
  for(let p of state.platforms) {
    let x=p.x-cam;

    if(x>-p.w&&x<W) {
      platform(x,p.y,p.w);
    }
  }

  // Grammatik-Tore
  for(let i=0;i<GATE_X.length;i++) {
    gate(GATE_X[i],i);
  }

  // Zielportal
  let ex=endX-cam;

  if(ex>-130&&ex<W+130) {
    circle(
      ex,FLOOR-114,95,
      '#6549c6aa'
    );

    circle(
      ex,FLOOR-114,72,
      '#7bdbf3b8'
    );

    circle(
      ex,FLOOR-114,53,
      '#b6a7ff'
    );

    text(
      'ZEITPORTAL',
      ex,FLOOR-222,23,
      '#fff5ba'
    );
  }

  // Sammelmünzen
  for(let c of state.coins) {
    if(!c.taken) {
      coin(c.x,c.y,state.time);
    }
  }
}

function render() {
  world();

  if(!state)return;

  sceneryExtras();

  hero(
    state.x,
    state.y,
    state.time,
    state.dir
  );

  if(
    state.notice &&
    state.noticeUntil>state.time

    round(
      380,85,360,48,12,
      '#163453e6'
    );

    text(
      state.notice,
      560,116,21,
      '#fff0bd'
    );
  }
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function shuffle(a) {
  a=[...a];

  for(let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

function updateHUD() {
  if(!state)return;

  document.getElementById('hGate').textContent =
    '🏰 Tor '+state.gate+'/10';

  document.getElementById('hCoins').textContent =

  document.getElementById('hCombo').textContent =
    '🔥 Serie '+state.combo;

}

function startGame() {
  cancelAnimationFrame(raf);

  const platforms=[];

  for(let i=0;i<12;i++) {
    const x=950+i*520;

    // Plattformen bewusst zwischen den Toren.
    platforms.push({
      x,
      y:420-(i%2)*48,
      w:165
    });
  }

  const coins=[];

  for(let i=0;i<48;i++) {
    coins.push({
      x:320+i*136,
      y:FLOOR-65-(i%4)*32,
      taken:false
    });
  }

  state={
    x:110,
    y:FLOOR-24,
    vx:0,
    vy:0,
    dir:1,
    grounded:true,
    cam:0,
    gate:0,
    score:0,
    combo:0,
    bestCombo:0,
    collected:0,
    time:0,
    paused:false,
    question:null,
    results:[],
    platforms,
    coins,
    notice:'',
    noticeUntil:0
  };

  keys.left=false;
  keys.right=false;
  keys.jump=false;

  updateHUD();
  hidePanel();

  previous=performance.now();
  raf=requestAnimationFrame(tick);
}

function makeQuestion(n) {
  const verb=verbs[n%verbs.length];
  const form=1+n%3;
  const correct=verb[form];

  let wrong=[];

  if(mode==='easy') {
    wrong=shuffle(
      verbs.filter(v=>v!==verb)
    ).map(v=>v[(form%3)+1]);
  } else {
    // Andere Zeitformen desselben Verbs
    wrong=[
      verb[1],
      verb[2],
      verb[3]
    ].filter(x=>x!==correct);

    // Zusätzlich bewusst falsche Formen
    const stem=verb[0].replace(/en$/,'');

    wrong.push(
      'hat ge'+stem+'t',
      'ist ge'+stem+'t',
      stem+'te',
      'hatte ge'+stem+'t'
    );
  }

  wrong=[...new Set(wrong)]
    .filter(x=>x!==correct);

  // Immer vier Antwortmöglichkeiten.
  for(let v of shuffle(verbs)) {
    if(wrong.length>=3)break;

    const candidate=v[form];

    if(candidate!==correct&&!wrong.includes(candidate)) {
      wrong.push(candidate);
    }
  }

  return {
    verb:verb[0],
    form,
    correct,
    choices:shuffle([
      correct,
      ...wrong.slice(0,3)
    ])
  };
}

function openQuestion() {
  if(!state||state.paused)return;

  state.paused=true;

  keys.left=false;
  keys.right=false;
  keys.jump=false;

  const q=makeQuestion(state.gate);
  state.question=q;
  questionStart=performance.now();

  showPanel(`
    <div class="sub">
      🗝️ MAGISCHES TOR ${state.gate+1}/10
    </div>

    <h2>Welche Form ist richtig?</h2>

    <p>
      Gesucht: <b>${forms[q.form]}</b>
    </p>

    <h1>${escapeHTML(q.verb)}</h1>

    <div class="answers">
      ${q.choices.map((a,i)=>`
        <button data-choice="${i}">
          ${escapeHTML(a)}
        </button>
      `).join('')}
    </div>

    <p class="sub">
      ⚡ Je schneller, desto mehr Punkte.
      Ohne Zeitdruck!
    </p>
  `);

  panel.querySelectorAll('[data-choice]')
    .forEach(b=>{
      b.onclick=()=>submitAnswer(
        Number(b.dataset.choice)
      );
    });
}

function submitAnswer(index) {
  if(!state||!state.question)return;

  const q=state.question;
  const chosen=q.choices[index];
  const correct=chosen===q.correct;

  const seconds=
    (performance.now()-questionStart)/1000;

  let base=0;
  let speed=0;
  let comboBonus=0;

  if(correct) {
    base=100;

    speed=Math.max(
      0,
      Math.round(1000*(1-seconds/20))
    );

    state.combo++;

    comboBonus=Math.min(
      500,
      (state.combo-1)*75
    );

    state.bestCombo=Math.max(
      state.bestCombo,
      state.combo
    );
  } else {
    state.combo=0;
  }

  const earned=base+speed+comboBonus;

  state.score+=earned;

  state.results.push({
    verb:q.verb,
    form:forms[q.form],
    chosen,
    correct:q.correct,
    right:correct,
    seconds,
    base,
    speed,
    comboBonus,
    earned
  });

  state.gate++;
  state.question=null;

  updateHUD();

  showPanel(`
    <h1>
      ${correct?'🌟 Richtig!':'📖 Fast geschafft!'}
    </h1>

    <p>
      Die richtige Form ist:
    </p>

    <h2>${escapeHTML(q.correct)}</h2>

    <p>
      ${correct
        ? `Grundpunkte: +${base}<br>
           Tempobonus: +${speed}<br>
           Serienbonus: +${comboBonus}`
        : 'Beim nächsten Tor geht es weiter!'}
    </p>

    <button id="continueButton">
      Weiter ➜
    </button>
  `);

  document.getElementById('continueButton')
    .onclick=()=>{
      hidePanel();
      state.paused=false;
    };
}

// ==========================================
// PHYSIK, KOLLISIONEN UND SPIELSCHLEIFE
// ==========================================

function tick(now) {
  if(!state)return;

  const dt=Math.min(
    .035,
    Math.max(0,(now-previous)/1000)
  );

  previous=now;

  if(!state.paused) {
    state.time+=dt;

    const direction=
      (keys.right?1:0)-(keys.left?1:0);

    state.vx=direction*290;

    if(direction!==0) {
      state.dir=direction;
    }

    if(keys.jump&&state.grounded) {
      state.vy=-650;
      state.grounded=false;
    }

    const oldFeet=state.y+24;

    state.vy+=1500*dt;

    state.x+=state.vx*dt;
    state.y+=state.vy*dt;

    state.x=Math.max(
      40,
      Math.min(WORLD-50,state.x)
    );

    // Boden
    if(state.y+24>=FLOOR) {
      state.y=FLOOR-24;
      state.vy=0;
      state.grounded=true;
    } else {
      state.grounded=false;

      // Landen auf Plattformen
      for(const p of state.platforms) {
        const feet=state.y+24;

        if(
          state.vy>=0 &&
          oldFeet<=p.y+8 &&
          feet>=p.y &&
          state.x+17>p.x &&
          state.x-17<p.x+p.w
        ) {
          state.y=p.y-24;
          state.vy=0;
          state.grounded=true;
          break;
        }
      }
    }

    // Münzen einsammeln
    for(const coin of state.coins) {
      if(coin.taken)continue;

      const dx=state.x-coin.x;
      const dy=(state.y-40)-coin.y;

      if(dx*dx+dy*dy<43*43) {
        coin.taken=true;
        state.collected++;
        state.score+=25;

        state.notice='🪙 +25 Punkte';
        state.noticeUntil=state.time+.8;

        updateHUD();
      }
    }

    // Ein Tor kann erst nach Beantwortung
    // der aktuellen Frage passiert werden.
    if(state.gate<GATE_X.length) {
      const limit=GATE_X[state.gate]-62;

      if(state.x>=limit) {
        state.x=limit;
        state.vx=0;

        openQuestion();
      }
    }

    // Kamera folgt der Spielfigur.
    const desired=Math.max(
      0,
      Math.min(WORLD-W,state.x-W*.34)
    );

    state.cam+=(desired-state.cam)*
      Math.min(1,dt*7);

    if(
      state.gate===10 &&
      state.x>=endX-50
    ) {
      finishGame();
      return;
    }
  }

  render();
  raf=requestAnimationFrame(tick);
}

// ==========================================
// TOUCH-STEUERUNG UND IPHONE-FIX
// ==========================================

function bindControl(id,key) {
  const b=document.getElementById(id);

  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    keys[key]=true;

    try {
      b.setPointerCapture(e.pointerId);
    } catch(err) {}
  });

  const release=e=>{
    e.preventDefault();
    keys[key]=false;
  };

  b.addEventListener('pointerup',release);
  b.addEventListener('pointercancel',release);
  b.addEventListener('lostpointercapture',()=>{
    keys[key]=false;
  });

  b.addEventListener('contextmenu',e=>{
    e.preventDefault();
  });

  b.addEventListener('selectstart',e=>{
    e.preventDefault();
  });
}

bindControl('left','left');
bindControl('right','right');
bindControl('jump','jump');

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();

  if(['arrowleft','arrowright',' ','arrowup'].includes(k)) {
    e.preventDefault();
  }

  if(k==='arrowleft'||k==='a') {
    keys.left=true;
  }

  if(k==='arrowright'||k==='d') {
    keys.right=true;
  }

  if(k===' '||k==='arrowup'||k==='w') {
    keys.jump=true;
  }
});

document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();

  if(k==='arrowleft'||k==='a') {
    keys.left=false;
  }

  if(k==='arrowright'||k==='d') {
    keys.right=false;
  }

  if(k===' '||k==='arrowup'||k==='w') {
    keys.jump=false;
  }
});

window.addEventListener('blur',()=>{
  keys.left=false;
  keys.right=false;
  keys.jump=false;
});

function finishGame() {
  if(!state)return;

  cancelAnimationFrame(raf);
  clearInterval(typingTimer);

  const data=[...state.results];

  const score=state.score;
  const collected=state.collected;
  const bestCombo=state.bestCombo;

  const correct=data.filter(r=>r.right).length;
  const wrong=data.length-correct;

  const base=data.reduce((s,r)=>s+r.base,0);
  const speed=data.reduce((s,r)=>s+r.speed,0);
  const combo=data.reduce((s,r)=>s+r.comboBonus,0);

  const average=data.length
    ? data.reduce((s,r)=>s+r.seconds,0)/data.length
    : 0;

  state.paused=true;

  showPanel(`

      geöffnet und das Zeitportal erreicht!

        Punkte

        Richtig

        <strong>${collected}</strong>
        Münzen

        <strong>${wrong}</strong>
        Fehler
      </div>

      <div>
        <strong>${bestCombo}</strong>
        Beste Serie

      </div>
    </div>

    <h2>Deine Punkte</h2>

    <p>
      Grundpunkte: ${base}<br>
      Tempobonus: ${speed}<br>
      Serienbonus: ${combo}<br>
      Münzen: ${collected*25}
    </p>

    <h2>📋 Deine Antworten</h2>

    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Verb / Zeit</th>
            <th>Deine Antwort</th>
            <th>Richtig</th>
          </tr>
        </thead>

        <tbody>
          ${data.map(r=>`
            <tr>
              <td>
                ${escapeHTML(r.verb)}<br>
                <small>${escapeHTML(r.form)}</small>
              </td>

              <td class="${r.right?'good':'bad'}">

              </td>

              <td>
                ${escapeHTML(r.correct)}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    <h2>🐉 Professor Flämmchen</h2>

    <p id="lessonTitle"></p>

    <div class="text" id="lessonText"></div>

    <button class="secondary" id="showAll">
      Text vollständig anzeigen
    </button>

    <button id="nextTip">

        nicht die Aufgaben.
      </p>

      <select id="language">
        <option value="">Sprache auswählen</option>
        <option value="uk">Українська</option>
        <option value="ru">Русский</option>
        <option value="mk">Македонски</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="tr">Türkçe</option>

}

// ==========================================
// GRAMMATIKDRACHE UND ÜBERSETZUNGEN
// ==========================================

let lesson=0;

function setupLessons() {
  lesson=0;

  document.getElementById('nextTip').onclick=()=>{
    lesson=(lesson+1)%explanations.length;
    displayLesson();
  };

  document.getElementById('showAll').onclick=()=>{
    clearInterval(typingTimer);

    document.getElementById('lessonText')
      .textContent=explanations[lesson][1];
  };

  document.getElementById('language').onchange=()=>{
    displayTranslation();
  };

  displayLesson();
}

function displayLesson() {
  clearInterval(typingTimer);

  const [title,body]=explanations[lesson];

  document.getElementById('lessonTitle')
    .textContent='🐉 '+title;

  const el=document.getElementById('lessonText');

  el.textContent='';

  let index=0;

  typingTimer=setInterval(()=>{
    if(!el.isConnected) {
      clearInterval(typingTimer);
      return;
    }

    index=Math.min(body.length,index+2);
    el.textContent=body.slice(0,index);

    if(index>=body.length) {
      clearInterval(typingTimer);
    }
  },24);

  displayTranslation();
}

function displayTranslation() {
  const select=document.getElementById('language');
  const target=document.getElementById('translation');

  if(!select||!target)return;

  const lang=select.value;

  target.textContent=
    lang&&translations[lang]
      ? translations[lang][lesson]
      : '';
}
