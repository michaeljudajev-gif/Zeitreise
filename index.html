<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081426;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.ctrl{border:2px solid #d9ac63;border-radius:16px;background:linear-gradient(#294f6f,#0a1d36);color:#ffe0a2;font-size:25px;font-weight:900;min-width:64px;height:59px;touch-action:none;box-shadow:0 5px 0 #071321}

.choice:active,.choice:hover{background:#285d7c;border-color:#f3ca82}.choice.correct{background:#1c6b50;border-color:#7ce6aa}.choice.wrong{background:#853c47;border-color:#ffa5a5}

/* 6.1: Aufgabe im eigenen rechten Bereich; das Spielfeld bleibt sichtbar. */
#stage:has(#challenge.show) canvas{width:62%;height:100%;object-fit:fill}
#stage:has(#challenge.show){background:#10283d}
#challenge{left:auto;right:1%;top:13%;bottom:auto;transform:none;width:36%;max-height:84%;padding:10px}
#challenge h3{font-size:clamp(15px,1.7vw,21px)}
#challenge p{font-size:clamp(12px,1.35vw,16px)}
#challenge input{padding:9px;font-size:16px}

#stage:has(#challenge.show) #hud .pill{font-size:clamp(10px,1.1vw,15px);padding:5px}
@media(max-width:700px){
 #stage:has(#challenge.show) canvas{width:100%;height:55%}

}

/* 6.2: Wolken-Overlay: voller Spielbildschirm, Aufgaben oben statt am Boden. */

#stage:has(#challenge.show) #hud{right:12px;top:5px;z-index:3;justify-content:flex-end}

#challenge,#challenge.show{left:50%;right:auto;top:7%;bottom:auto;transform:translateX(-50%);width:min(650px,78%);max-height:43%;padding:9px 14px;overflow:auto;background:linear-gradient(145deg,#163a59f5,#0a1b36f5);box-shadow:0 5px 25px #0009}
#challenge h3{font-size:clamp(16px,1.8vw,22px);margin:1px 0 3px}
#challenge p{font-size:clamp(12px,1.35vw,16px);margin:3px 0 6px}
#challenge .choice{display:inline-block;vertical-align:top;width:calc(50% - 8px);margin:3px 3px;padding:6px 8px;font-size:clamp(12px,1.2vw,15px)}
#challenge input{padding:8px;margin:3px 0 6px}
#challenge .primary{padding:6px 13px}
@media(max-width:700px){
 #stage:has(#challenge.show) canvas{width:100%;height:100%}
 #stage:has(#challenge.show) #hud{right:5px;top:3px}
 #stage:has(#challenge.show) #hud .pill{font-size:9px;padding:2px 3px}
 #challenge,#challenge.show{left:50%;right:auto;top:9%;bottom:auto;transform:translateX(-50%);width:96%;max-height:49%;padding:5px 8px}
 #challenge h3{font-size:15px}
 #challenge p{font-size:12px;margin:2px 0 4px}
 #challenge .choice{width:calc(50% - 6px);margin:2px;padding:4px;font-size:12px}
 #challenge input{padding:6px;font-size:15px}
}

/* 7.0: Bossfragen ebenfalls im Himmel; die Landschaft bleibt sichtbar. */
#veil:has(.boss) {background:transparent;backdrop-filter:none;display:block;pointer-events:none;padding:0}
#veil:has(.boss) .panel {position:absolute;left:50%;top:7%;transform:translateX(-50%);width:min(660px,82%);max-height:47%;padding:12px 18px;pointer-events:auto;background:#102944f5}
#veil:has(.boss) .panel h2 {font-size:20px;margin:3px 0}
#veil:has(.boss) .panel p {font-size:15px;margin:5px 0}
#veil:has(.boss) .choice {display:inline-block;width:calc(50% - 8px);margin:3px;padding:6px;font-size:14px}
#veil:has(.boss) .primary {padding:7px 12px}
@media(max-width:700px){#veil:has(.boss) .panel{width:96%;top:8%;max-height:52%;padding:7px}#veil:has(.boss) .panel p{font-size:12px}#veil:has(.boss) .choice{font-size:11px;padding:4px}}
</style></head><body><main id="shell"><header><h1>✦ ZEITREISE <small>Das Dorf der Zeiten</small></h1><div class="version">MISSION 1 · DIE TORE DER ZEIT<br>ENGINE 7.0 · SECHS WELTEN</div></header>
<div id="stage"><canvas id="game" width="1280" height="720"></canvas><div id="hud"><span class="pill" id="zoneHud">🗺️ Das Dorf</span><span class="pill" id="gateHud">🏰 Boss 0/6</span><span class="pill" id="coinHud">🪙 0</span><span class="pill" id="streakHud">🔥 Serie 0</span><span class="pill" id="scoreHud">⭐ 0</span></div><div id="toast"></div><div id="challenge"></div><button id="dragonHelp" onclick="toggleDragon()">🐉 Drache · Hilfe</button><div id="dragonPanel"></div>

<script>
'use strict';
const C=document.getElementById('game'),g=C.getContext('2d'),W=1280,H=720,FLOOR=594,LEVEL=9400;
const $=id=>document.getElementById(id), veil=$('veil'),panel=$('panel');

const stars=Array.from({length:80},()=>({x:rnd(0,W),y:rnd(0,310),r:rnd(.5,1.9),p:rnd(0,TAU)}));

['lernen','lernte','hat gelernt','hatte gelernt'],['essen','aß','hat gegessen','hatte gegessen'],
['kommen','kam','ist gekommen','war gekommen'],['schreiben','schrieb','hat geschrieben','hatte geschrieben'],
['sprechen','sprach','hat gesprochen','hatte gesprochen'],['finden','fand','hat gefunden','hatte gefunden'],
['arbeiten','arbeitete','hat gearbeitet','hatte gearbeitet'],['lesen','las','hat gelesen','hatte gelesen'],
['trinken','trank','hat getrunken','hatte getrunken'],['bleiben','blieb','ist geblieben','war geblieben'],
['kaufen','kaufte','hat gekauft','hatte gekauft'],['nehmen','nahm','hat genommen','hatte genommen']
];
const examples=[
{q:'Gestern ___ ich zu Fuß nach Hause.',v:0,f:1,a:'ging'},
{q:'Als ich ankam, ___ der Film schon ___.',v:6,f:3,a:'hatte angefangen',custom:['hatte angefangen','hat angefangen','war angefangen','hatte anfangen']},
{q:'Letzte Woche ___ ich einen interessanten Artikel.',v:7,f:1,a:'schrieb'},
{q:'Heute ___ ich schon drei neue Wörter ___.',v:4,f:2,a:'habe gelernt',custom:['habe gelernt','hat gelernt','hatte lernen','bin gelernt']},
{q:'Früher ___ sie jeden Tag im Büro.',v:10,f:1,a:'arbeitete'},
{q:'Wir ___ gestern sehr spät nach Hause ___.',v:3,f:2,a:'sind gefahren',custom:['sind gefahren','haben gefahren','waren fahren','fuhren gefahren']},
{q:'Als ich das Buch suchte, ___ mein Bruder es schon ___.',v:11,f:3,a:'hatte gelesen'},
{q:'Letztes Jahr ___ wir nach Berlin.',v:6,f:1,a:'kamen'},
{q:'Ich ___ meine Schlüssel endlich ___.',v:9,f:2,a:'habe gefunden',custom:['habe gefunden','bin gefunden','hat gefunden','habe findete']},
{q:'Bevor sie anrief, ___ ich schon mit ihm ___.',v:8,f:3,a:'hatte gesprochen'}

// All in-field prompts are genuine language tasks, not decorative obstacles.
const fieldTasks=[
{type:'choice',q:'Gestern ___ ich einen Brief.',a:'schrieb',opts:['schrieb','schreibte','geschrieben','schreibe'],ex:'Präteritum von schreiben: ich schrieb.'},
{type:'write',q:'Schreibe das Präteritum: gehen (ich)',a:'ging',ex:'gehen ist unregelmäßig: ich ging.'},
{type:'fix',q:'Korrigiere: „Ich habe gestern nach Berlin gefahrt.“',a:'Ich bin gestern nach Berlin gefahren.',ex:'Bei einer Ortsveränderung: sein + gefahren.'},
{type:'choice',q:'Wir ___ schon gegessen, bevor er kam.',a:'hatten',opts:['hatten','haben','sind','waren'],ex:'Vorvergangenheit: wir hatten gegessen.'},
{type:'write',q:'Schreibe das Partizip II von „sehen“.',a:'gesehen',ex:'sehen → sah → gesehen.'},
{type:'fix',q:'Korrigiere: „Er hat nach Hause gegangen.“',a:'Er ist nach Hause gegangen.',ex:'gehen bildet das Perfekt mit sein.'},

{type:'write',q:'Schreibe das Präteritum: nehmen (er)',a:'nahm',ex:'nehmen → nahm → genommen.'},
{type:'fix',q:'Korrigiere: „Sie hatte den Text geschreibt.“',a:'Sie hatte den Text geschrieben.',ex:'schreiben → geschrieben.'},
{type:'choice',q:'Heute ___ ich schon Kaffee getrunken.',a:'habe',opts:['habe','bin','hatte','war'],ex:'Perfekt: ich habe getrunken.'},
{type:'write',q:'Schreibe das Partizip II von „finden“.',a:'gefunden',ex:'finden → fand → gefunden.'},
{type:'fix',q:'Korrigiere: „Wir sind das Buch gelesen.“',a:'Wir haben das Buch gelesen.',ex:'lesen bildet das Perfekt mit haben.'},
{type:'choice',q:'Als ich ankam, ___ sie schon eingeschlafen.',a:'war',opts:['war','hat','ist','hatte'],ex:'Plusquamperfekt von einschlafen: sie war eingeschlafen.'},
{type:'write',q:'Schreibe das Präteritum: essen (ich)',a:'aß',ex:'essen → aß → gegessen.'},
{type:'fix',q:'Korrigiere: „Er hat das Fenster geöffnen.“',a:'Er hat das Fenster geöffnet.',ex:'öffnen → geöffnet.'},

{type:'write',q:'Schreibe das Partizip II von „sprechen“.',a:'gesprochen',ex:'sprechen → sprach → gesprochen.'},
{type:'fix',q:'Korrigiere: „Ich war meine Hausaufgaben gemacht.“',a:'Ich hatte meine Hausaufgaben gemacht.',ex:'machen bildet das Plusquamperfekt mit hatte.'},
{type:'choice',q:'Gestern ___ er sehr früh auf.',a:'stand',opts:['stand','steht','gestanden','standet'],ex:'aufstehen → er stand auf.'},
{type:'write',q:'Schreibe das Präteritum: bleiben (wir)',a:'blieben',ex:'bleiben → wir blieben.'},
{type:'fix',q:'Korrigiere: „Sie ist einen Kuchen gebacken.“',a:'Sie hat einen Kuchen gebacken.',ex:'backen bildet das Perfekt mit haben.'},

{type:'write',q:'Schreibe das Partizip II von „bringen“.',a:'gebracht',ex:'bringen → brachte → gebracht.'},
{type:'fix',q:'Korrigiere: „Er hat das Auto gewaschen gehabt.“ (Perfekt)',a:'Er hat das Auto gewaschen.',ex:'Perfekt: hat gewaschen, ohne zusätzliches gehabt.'},
{type:'choice',q:'Gestern ___ ich meine Freundin.',a:'traf',opts:['traf','treffte','getroffen','treffe'],ex:'treffen → traf → getroffen.'},
{type:'write',q:'Schreibe das Präteritum: wissen (ich)',a:'wusste',ex:'wissen → ich wusste.'},
{type:'fix',q:'Korrigiere: „Wir haben nach Hause gelauft.“',a:'Wir sind nach Hause gelaufen.',ex:'laufen → ist gelaufen (Ortsveränderung).'},

];

{type:'order',q:'Ordne: „er / bevor / ging / gegessen / hatte / er“',a:'Bevor er ging, hatte er gegessen.',ex:'Nebensatz mit bevor: Verb am Ende.'},

g.save();g.translate(-6,33);g.rotate(-arm*.25-.15);poly([[-7,-9],[-32,0],[-24,38],[4,21]],'#245e8a','#183852',3);g.restore();
for(let i of [-1,1]){g.save();g.translate(i*10,49);g.rotate((i===1?leg:-leg)*.43+(hero.grounded?0:-.17));rr(-6,0,12,21,5,'#e6b287');rr(-8,16,16,15,4,'#563b31');rr(-10,26,23,9,3,'#42343a');g.restore()}
rr(-17,25,34,30,8,outfits[outfit],'#e8c38b',3);poly([[-18,45],[18,45],[23,58],[-22,58]],'#245079');rr(-15,37,30,6,2,'#e8bd5e');
for(let i of [-1,1]){g.save();g.translate(i*18,29);g.rotate((i===1?arm:-arm)*.36);rr(-5,0,11,23,5,'#f3d7bd');circle(1,22,6,'#eec6a3');g.restore()}
circle(0,9,21,'#edb38f');circle(-4,9,20,'#edc1a0');
for(let i=0;i<7;i++){let a=i*.58+2.8;circle(Math.cos(a)*17,6+Math.sin(a)*15,8,'#a74d2d')}
poly([[-22,3],[-20,-9],[-9,-18],[8,-16],[20,-4],[16,2],[5,-9],[-7,-3]],'#d15c32');
for(let i=0;i<3;i++){let wave=Math.sin(t*9-i)*3;poly([[-13,0],[-32-i*8,-7+wave],[-23-i*8,7+wave]],i%2?'#c65a30':'#e77939')}
circle(7,8,2.7,'#233b51');circle(16,8,2.7,'#233b51');circle(13,17,3,'#e17f77');g.strokeStyle='#854b47';g.lineWidth=1.5;g.beginPath();g.arc(10,18,4,.15,Math.PI-.15);g.stroke();
g.restore()}
function emit(x,y,n,col){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-90,90),vy:rnd(-170,-30),life:rnd(.4,1.1),max:1.1,color:col,r:rnd(2,6)})}
function update(dt){t+=dt;if(mode!=='play')return;
let axis=Number(keys.right)-Number(keys.left),acc=hero.grounded?1600:1000;
hero.vx+=axis*acc*dt;if(!axis)hero.vx*=Math.exp(-11*dt);hero.vx=clamp(hero.vx,-275,275);
if(axis)hero.face=axis;
if(biome()!==zoneSeen){zoneSeen=biome();$('zoneHud').textContent='🗺️ '+worlds[zoneSeen];}
if(keys.jump&&hero.grounded){hero.vy=-560;hero.grounded=false;emit(hero.x,hero.y+65,7,'#c3d8b6')}
let prevFeet=hero.y+hero.h;hero.vy+=1350*dt;hero.x=clamp(hero.x+hero.vx*dt,25,LEVEL-50);hero.y+=hero.vy*dt;hero.grounded=false;
if(hero.vy>=0){for(let p of platforms){if(prevFeet<=p.y+8&&hero.y+hero.h>=p.y&&hero.x+20>p.x&&hero.x-20<p.x+p.w){hero.y=p.y-hero.h;hero.vy=0;hero.grounded=true;break}}}
if(hero.y+hero.h>=FLOOR){hero.y=FLOOR-hero.h;hero.vy=0;hero.grounded=true}
for(let o of obstacles){if(o.done)continue;let stop=o.x-67;if(hero.x>=stop&&hero.vx>0){hero.x=stop;hero.vx=0;showField(o);break}}
cam+=(clamp(hero.x-W*.32,0,LEVEL-W)-cam)*Math.min(1,dt*5);
for(let c of collectibles){if(!c.got&&Math.abs(c.x-hero.x)<31&&Math.abs(c.y-(hero.y+33))<54){c.got=true;coins++;score+=10;emit(c.x,c.y,10,'#ffe398');hud()}}
let gate=gates[gateIndex];if(mode==='play'&&gate&&obstacles.slice(gateIndex*10,(gateIndex+1)*10).every(o=>o.done)&&Math.abs(hero.x-gate.x)<56&&Math.abs(hero.y+hero.h-FLOOR)<80){mode='quiz';keys.left=keys.right=keys.jump=false;openQuiz()}
particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=230*dt;p.life-=dt}
}
function draw(){g.clearRect(0,0,W,H);sky();village();terrain();
for(let p of platforms)drawPlatform(p);
for(let c of collectibles)if(!c.got&&c.x>cam-50&&c.x<cam+W+50)coin(c.x-cam,c.y+Math.sin(t*3+c.x)*5,.83);
gates.forEach(portal);let nextObstacle=obstacles.find(o=>!o.done);for(let o of obstacles){if(o.done||!nextObstacle||o.id<=nextObstacle.id+1)obstacleDraw(o)}
if(biome()===4){g.save();g.translate(990,245+Math.sin(t)*17);g.rotate(Math.sin(t)*.05);poly([[-52,-45],[52,-45],[30,30],[-30,30]],'#e9a652','#7b4c32',5);line(-30,30,-20,76,'#e5d5a8',3);line(30,30,20,76,'#e5d5a8',3);rr(-24,70,48,22,5,'#805b3b');g.restore()}
if(biome()===3){for(let i=0;i<4;i++){let x=160+i*310-(cam%310);circle(x,FLOOR-12,21,'#e6f6ff');circle(x,FLOOR-38,15,'#f8fdff');circle(x-5,FLOOR-41,2,'#34465b')}}
for(let d of dust){let x=d.x-cam;if(x<0||x>W)continue;circle(x+Math.sin(t+d.phase)*6,d.y+Math.sin(t*.8+d.phase)*11,d.r,'#ffedb455')}
for(let p of particles){g.globalAlpha=clamp(p.life/p.max,0,1);circle(p.x-cam,p.y,p.r,p.color)}g.globalAlpha=1;heroine();dragon(W-73,115);
let vignette=g.createRadialGradient(W/2,H/2,190,W/2,H/2,830);vignette.addColorStop(0,'transparent');vignette.addColorStop(1,'#07152875');g.fillStyle=vignette;g.fillRect(0,0,W,H)}
function frame(now){let dt=Math.min(.033,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(frame)}
function hud(){$('gateHud').textContent=`🏰 Boss ${gateIndex}/6`;$('coinHud').textContent=`🪙 ${coins}`;$('streakHud').textContent=`🔥 Serie ${streak}`;$('scoreHud').textContent=`⭐ ${score}`}
function show(html){panel.innerHTML=html;veil.classList.remove('hidden')}function hide(){veil.classList.add('hidden')}
function playSound(freq){if(!soundOn)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),v=a.createGain();o.type='sine';o.frequency.value=freq;o.connect(v);v.connect(a.destination);v.gain.setValueAtTime(.08,a.currentTime);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);o.start();o.stop(a.currentTime+.18);o.onended=()=>a.close()}catch(e){}}
function saveGame(){try{localStorage.setItem('zeitreise7',JSON.stringify({difficulty,gateIndex,score,coins,streak,fieldCorrect,heroX:hero.x,outfit,obstacles:obstacles.map(o=>o.done),gates:gates.map(g=>g.done),collectibles:collectibles.map(c=>c.got),answers}))}catch(e){}}
function loadGame(){try{let v=JSON.parse(localStorage.getItem('zeitreise7')||'null');if(!v){alert('Noch kein Spielstand vorhanden.');return}start(v.difficulty||'normal');gateIndex=v.gateIndex||0;score=v.score||0;coins=v.coins||0;streak=v.streak||0;fieldCorrect=v.fieldCorrect||0;hero.x=v.heroX||120;outfit=v.outfit||0;answers=v.answers||[];obstacles.forEach((o,i)=>o.done=!!v.obstacles?.[i]);gates.forEach((g,i)=>g.done=!!v.gates?.[i]);collectibles.forEach((c,i)=>c.got=!!v.collectibles?.[i]);cam=clamp(hero.x-W*.32,0,LEVEL-W);hud();hide();mode='play'}catch(e){alert('Spielstand konnte nicht geladen werden.')}}
function showReward(){let b=gateIndex;let cost=[0,10,20,30][Math.min(b,3)];show(`<div class="tag">WELT ${b} / 6 GESCHAFFT</div><h2>✨ ${worlds[b-1]} geschafft!</h2><p>Du hast ${fieldCorrect} Hindernisse gelöst und ${coins} Münzen gesammelt.</p><p>🎨 Kaufe eine neue Tunika: ${cost} Münzen</p><div class="row"><button class="primary" onclick="buyOutfit(${Math.min(b,3)},${cost})">🧥 Kostüm freischalten</button><button class="primary" onclick="hide();mode='play';saveGame()">▶ Weiterreisen</button></div>`);mode='reward'}
function buyOutfit(n,cost){if(coins<cost){alert('Du brauchst noch '+(cost-coins)+' Münzen.');return}coins-=cost;outfit=n;hud();hide();mode='play';saveGame();playSound(880)}
function menu(){mode='menu';show(`<div class="tag">ZEITREISE · ENGINE 7.0</div><h2>Die sechs Welten der Zeit</h2><p>🏡 Dorf · 🌲 Zauberwald · 🌊 Fluss · ❄️ Schnee · 🎈 Wolken · 🏰 Schloss</p><p>60 Hindernisrätsel und 6 Boss-Tore. Wähle, schreibe, korrigiere, ordne Sätze und ergänze Dialoge. 🐉 Fynn erklärt die Zeitformen in sieben Sprachen. Sammle Münzen für neue Kleidung!</p><div class="row"><button class="primary" onclick="start('normal')">⚔️ Abenteuer starten</button><button class="primary" onclick="start('hard')">🔥 Schwer</button><button class="primary" onclick="loadGame()">💾 Fortsetzen</button></div><p class="small">A/D oder ←/→ bewegen · Leertaste springen · S: Ton an/aus · 🪙 Kostüme: 10/20/30 Münzen</p>`)}
function start(diff){difficulty=diff;gateIndex=0;score=0;coins=0;streak=0;fieldCorrect=0;answers=[];cam=0;zoneSeen=-1;hero.x=120;hero.y=FLOOR-70;hero.vx=hero.vy=0;gates.forEach(x=>x.done=false);obstacles.forEach(x=>x.done=false);activeObstacle=null;currentTask=null;$('challenge').classList.remove('show');collectibles.forEach(x=>x.got=false);particles=[];hud();mode='play';hide();saveGame()}
function shuffle(a){return a.map(x=>({x,k:Math.random()})).sort((a,b)=>a.k-b.k).map(o=>o.x)}
let current=null,options=[];
function makeOptions(q){if(q.custom)return shuffle([...q.custom]);let pool=[q.a,...verbs.flatMap(v=>v.slice(1))].filter(x=>x!==q.a);pool=shuffle([...new Set(pool)]);return shuffle([q.a,...pool.slice(0,3)])}
function openQuiz(){current=[examples[0],examples[3],examples[5],examples[6],examples[8],examples[9]][gateIndex];options=makeOptions(current);let type=gateIndex%3;let controls=type===0?options.map((x,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)} · ${x}</button>`).join(''):`<input id="gateInput" style="width:100%;padding:12px;border-radius:10px;font-size:18px" placeholder="${type===1?'Richtige Form eingeben':'Fehler korrigieren: richtige Form eingeben'}" onkeydown="if(event.key==='Enter')answer(-1)"/><button class="primary" onclick="answer(-1)">Antwort prüfen</button>`;
show(`<div class="boss"><div class="tag">BOSS-TOR ${gateIndex+1} / 6 · ${['AUSWÄHLEN','SCHREIBEN','KORRIGIEREN'][type]}</div><h2>🐉 Das Tor der Zeit</h2><p style="font-size:clamp(18px,2.5vw,26px);color:#fff">${current.q}</p><div id="choices">${controls}</div><p class="small">Du kannst den Drachen für eine Erklärung öffnen.</p></div>`)}
function answer(i){if(mode!=='quiz')return;let type=gateIndex%3,picked=type===0?options[i]:$('gateInput').value,ok=norm(picked)===norm(current.a);answers.push({gate:gateIndex+1,question:current.q,chosen:picked,correct:current.a,ok});score+=ok?(difficulty==='hard'?170:120)+streak*20:20;streak=ok?streak+1:0;gates[gateIndex].done=true;
document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(options[j]===current.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});if($('gateInput'))$('gateInput').disabled=true;saveGame();playSound(ok?800:240);
panel.insertAdjacentHTML('beforeend',`<p style="color:${ok?'#a2f4b6':'#ffb2a7'}"><b>${ok?'✨ Richtig!':'📖 Noch nicht ganz.'}</b> Richtige Antwort: <b>${current.a}</b>.</p><button class="primary" onclick="continueGame()">${gateIndex===5?'🏆 Ergebnis ansehen':'✨ Weiterreisen'}</button>`);mode='feedback';hud();emit(gates[gateIndex].x,FLOOR-100,35,ok?'#b1ffdc':'#ffdd99')}
function continueGame(){gateIndex++;hud();if(gateIndex>=6){finish();return}hero.x=gates[gateIndex-1].x+120;hero.y=FLOOR-hero.h;hero.vx=0;mode='play';hide();saveGame();if(gateIndex>0){showReward()}}
function finish(){mode='finish';let correct=answers.filter(a=>a.ok).length;show(`<div class="tag">ABENTEUER ABGESCHLOSSEN</div><h2>🏆 Zeitreise geschafft!</h2><p>Du hast sechs Welten mit 60 Hindernissen und sechs Boss-Toren gemeistert.</p><h2>${correct}/6 Boss-Tore richtig · ⭐ ${score}</h2><p>🪙 ${coins} Münzen gesammelt</p><div style="max-height:160px;overflow:auto;text-align:left">${answers.map(a=>`<p class="small">${a.ok?'✅':'❌'} Tor ${a.gate}: ${a.correct}</p>`).join('')}</div><button class="primary" onclick="start('${difficulty}')">🔁 Noch einmal spielen</button>`)}
function setKey(k,on){if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=on;if(k==='ArrowRight'||k==='d'||k==='D')keys.right=on;if(k===' '||k==='ArrowUp'||k==='w'||k==='W')keys.jump=on}
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='s'&&!e.target.closest('input, textarea, select, [contenteditable=true]')){soundOn=!soundOn;return}if(e.target.closest('input, textarea, select, [contenteditable=true]'))return;if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();setKey(e.key,true)});
document.addEventListener('keyup',e=>{if(e.target.closest('input, textarea, select, [contenteditable=true]'))return;setKey(e.key,false)});window.addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false});
for(let [id,k] of [['left','left'],['right','right'],['jump','jump']]){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)}
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());
menu();hud();requestAnimationFrame(frame);
</script></body></html>
