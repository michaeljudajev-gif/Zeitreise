<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1629"><title>ZEITREISE 6.0 – Das Dorf der Zeiten</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081426;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

</style></head><body><main id="shell"><header><h1>✦ ZEITREISE <small>Das Dorf der Zeiten</small></h1><div class="version">MISSION 1 · DIE TORE DER ZEIT<br>ENGINE 6.0 · DRACHEN & HINDERNISSE</div></header>
<div id="stage"><canvas id="game" width="1280" height="720"></canvas><div id="hud"><span class="pill" id="gateHud">🏰 Tor 0/10</span><span class="pill" id="coinHud">🪙 0</span><span class="pill" id="streakHud">🔥 Serie 0</span><span class="pill" id="scoreHud">⭐ 0</span></div><div id="toast"></div><div id="challenge"></div><button id="dragonHelp" onclick="toggleDragon()">🐉 Drache · Hilfe</button><div id="dragonPanel"></div>

<script>
'use strict';
const C=document.getElementById('game'),g=C.getContext('2d'),W=1280,H=720,FLOOR=594,LEVEL=7900;
const $=id=>document.getElementById(id), veil=$('veil'),panel=$('panel');
const TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a), clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let t=0,last=0,cam=0,mode='menu',difficulty='normal',gateIndex=0,score=0,coins=0,streak=0,answers=[],toastEnd=0,particles=[],sparkles=[];
const keys={left:false,right:false,jump:false};
const hero={x:120,y:FLOOR-70,vx:0,vy:0,w:42,h:70,grounded:true,face:1,step:0,blink:0};
const gates=Array.from({length:10},(_,i)=>({x:700+i*735,done:false}));
// Three challenges before each gate: 30 field challenges + 10 gate questions.
const obstacles=Array.from({length:30},(_,i)=>({x:310+Math.floor(i/3)*735+(i%3)*116,kind:['river','tree','stone'][i%3],done:false,id:i}));
let activeObstacle=null,dragonOpen=false,language='de',currentTask=null,attempts=0;
const platforms=Array.from({length:19},(_,i)=>({x:420+i*365,y:FLOOR-95-(i%3)*35,w:155}));
const collectibles=Array.from({length:62},(_,i)=>({x:260+i*118,y:FLOOR-48-(i%5===0?145:i%3===0?100:0),got:false}));
const stars=Array.from({length:80},()=>({x:rnd(0,W),y:rnd(0,310),r:rnd(.5,1.9),p:rnd(0,TAU)}));
const dust=Array.from({length:55},()=>({x:rnd(0,LEVEL),y:rnd(120,FLOOR),r:rnd(.5,2),phase:rnd(0,TAU)}));
const verbs=[
['gehen','ging','ist gegangen','war gegangen'],['sehen','sah','hat gesehen','hatte gesehen'],
['machen','machte','hat gemacht','hatte gemacht'],['fahren','fuhr','ist gefahren','war gefahren'],
['lernen','lernte','hat gelernt','hatte gelernt'],['essen','aß','hat gegessen','hatte gegessen'],
['kommen','kam','ist gekommen','war gekommen'],['schreiben','schrieb','hat geschrieben','hatte geschrieben'],
['sprechen','sprach','hat gesprochen','hatte gesprochen'],['finden','fand','hat gefunden','hatte gefunden'],
['arbeiten','arbeitete','hat gearbeitet','hatte gearbeitet'],['lesen','las','hat gelesen','hatte gelesen'],
['trinken','trank','hat getrunken','hatte getrunken'],['bleiben','blieb','ist geblieben','war geblieben'],
['kaufen','kaufte','hat gekauft','hatte gekauft'],['nehmen','nahm','hat genommen','hatte genommen']
];
const examples=[
{q:'Gestern ___ ich zu Fuß nach Hause.',v:0,f:1,a:'ging'},
{q:'Als ich ankam, ___ der Film schon ___.',v:6,f:3,a:'hatte angefangen',custom:['hatte angefangen','hat angefangen','war angefangen','hatte anfangen']},
{q:'Letzte Woche ___ ich einen interessanten Artikel.',v:7,f:1,a:'schrieb'},
{q:'Heute ___ ich schon drei neue Wörter ___.',v:4,f:2,a:'habe gelernt',custom:['habe gelernt','hat gelernt','hatte lernen','bin gelernt']},
{q:'Früher ___ sie jeden Tag im Büro.',v:10,f:1,a:'arbeitete'},
{q:'Wir ___ gestern sehr spät nach Hause ___.',v:3,f:2,a:'sind gefahren',custom:['sind gefahren','haben gefahren','waren fahren','fuhren gefahren']},
{q:'Als ich das Buch suchte, ___ mein Bruder es schon ___.',v:11,f:3,a:'hatte gelesen'},
{q:'Letztes Jahr ___ wir nach Berlin.',v:6,f:1,a:'kamen'},
{q:'Ich ___ meine Schlüssel endlich ___.',v:9,f:2,a:'habe gefunden',custom:['habe gefunden','bin gefunden','hat gefunden','habe findete']},
{q:'Bevor sie anrief, ___ ich schon mit ihm ___.',v:8,f:3,a:'hatte gesprochen'}
];
// All in-field prompts are genuine language tasks, not decorative obstacles.
const fieldTasks=[
{type:'choice',q:'Gestern ___ ich einen Brief.',a:'schrieb',opts:['schrieb','schreibte','geschrieben','schreibe'],ex:'Präteritum von schreiben: ich schrieb.'},
{type:'write',q:'Schreibe das Präteritum: gehen (ich)',a:'ging',ex:'gehen ist unregelmäßig: ich ging.'},
{type:'fix',q:'Korrigiere: „Ich habe gestern nach Berlin gefahrt.“',a:'Ich bin gestern nach Berlin gefahren.',ex:'Bei einer Ortsveränderung: sein + gefahren.'},
{type:'choice',q:'Wir ___ schon gegessen, bevor er kam.',a:'hatten',opts:['hatten','haben','sind','waren'],ex:'Vorvergangenheit: wir hatten gegessen.'},
{type:'write',q:'Schreibe das Partizip II von „sehen“.',a:'gesehen',ex:'sehen → sah → gesehen.'},
{type:'fix',q:'Korrigiere: „Er hat nach Hause gegangen.“',a:'Er ist nach Hause gegangen.',ex:'gehen bildet das Perfekt mit sein.'},
{type:'choice',q:'Letzte Woche ___ wir viel.',a:'lernten',opts:['lernten','gelernt','lernen','lerntet'],ex:'Regelmäßiges Präteritum: wir lernten.'},
{type:'write',q:'Schreibe das Präteritum: nehmen (er)',a:'nahm',ex:'nehmen → nahm → genommen.'},
{type:'fix',q:'Korrigiere: „Sie hatte den Text geschreibt.“',a:'Sie hatte den Text geschrieben.',ex:'schreiben → geschrieben.'},
{type:'choice',q:'Heute ___ ich schon Kaffee getrunken.',a:'habe',opts:['habe','bin','hatte','war'],ex:'Perfekt: ich habe getrunken.'},
{type:'write',q:'Schreibe das Partizip II von „finden“.',a:'gefunden',ex:'finden → fand → gefunden.'},
{type:'fix',q:'Korrigiere: „Wir sind das Buch gelesen.“',a:'Wir haben das Buch gelesen.',ex:'lesen bildet das Perfekt mit haben.'},
{type:'choice',q:'Als ich ankam, ___ sie schon eingeschlafen.',a:'war',opts:['war','hat','ist','hatte'],ex:'Plusquamperfekt von einschlafen: sie war eingeschlafen.'},
{type:'write',q:'Schreibe das Präteritum: essen (ich)',a:'aß',ex:'essen → aß → gegessen.'},
{type:'fix',q:'Korrigiere: „Er hat das Fenster geöffnen.“',a:'Er hat das Fenster geöffnet.',ex:'öffnen → geöffnet.'},
{type:'choice',q:'Früher ___ meine Oma in Dresden.',a:'wohnte',opts:['wohnte','gewohnt','wohnt','wohnen'],ex:'wohnen ist regelmäßig: wohnte.'},
{type:'write',q:'Schreibe das Partizip II von „sprechen“.',a:'gesprochen',ex:'sprechen → sprach → gesprochen.'},
{type:'fix',q:'Korrigiere: „Ich war meine Hausaufgaben gemacht.“',a:'Ich hatte meine Hausaufgaben gemacht.',ex:'machen bildet das Plusquamperfekt mit hatte.'},
{type:'choice',q:'Gestern ___ er sehr früh auf.',a:'stand',opts:['stand','steht','gestanden','standet'],ex:'aufstehen → er stand auf.'},
{type:'write',q:'Schreibe das Präteritum: bleiben (wir)',a:'blieben',ex:'bleiben → wir blieben.'},
{type:'fix',q:'Korrigiere: „Sie ist einen Kuchen gebacken.“',a:'Sie hat einen Kuchen gebacken.',ex:'backen bildet das Perfekt mit haben.'},
{type:'choice',q:'Bevor der Bus kam, ___ wir lange gewartet.',a:'hatten',opts:['hatten','waren','haben','sind'],ex:'Plusquamperfekt: wir hatten gewartet.'},
{type:'write',q:'Schreibe das Partizip II von „bringen“.',a:'gebracht',ex:'bringen → brachte → gebracht.'},
{type:'fix',q:'Korrigiere: „Er hat das Auto gewaschen gehabt.“ (Perfekt)',a:'Er hat das Auto gewaschen.',ex:'Perfekt: hat gewaschen, ohne zusätzliches gehabt.'},
{type:'choice',q:'Gestern ___ ich meine Freundin.',a:'traf',opts:['traf','treffte','getroffen','treffe'],ex:'treffen → traf → getroffen.'},
{type:'write',q:'Schreibe das Präteritum: wissen (ich)',a:'wusste',ex:'wissen → ich wusste.'},
{type:'fix',q:'Korrigiere: „Wir haben nach Hause gelauft.“',a:'Wir sind nach Hause gelaufen.',ex:'laufen → ist gelaufen (Ortsveränderung).'},
{type:'choice',q:'Nachdem er gegessen ___, ging er schlafen.',a:'hatte',opts:['hatte','war','hat','ist'],ex:'Plusquamperfekt: nachdem er gegessen hatte.'},
{type:'write',q:'Schreibe das Partizip II von „vergessen“.',a:'vergessen',ex:'vergessen → vergaß → vergessen.'},
{type:'fix',q:'Korrigiere: „Sie hatte das Lied gesingt.“',a:'Sie hatte das Lied gesungen.',ex:'singen → sang → gesungen.'}
];
const translations={
 de:{title:'Die drei Vergangenheitsformen',body:'Präteritum: Ich ging. Oft in Geschichten und Berichten. Perfekt: Ich bin gegangen. Oft im Gespräch. Plusquamperfekt: Ich war gegangen. Eine Handlung geschah vor einer anderen Handlung in der Vergangenheit.',tip:'Bei Bewegungsverben steht im Perfekt häufig „sein“. Schreibe bei Korrekturen den ganzen Satz.'},
 en:{title:'The three past tenses',body:'Simple past (Präteritum): Ich ging – often used in stories. Present perfect (Perfekt): Ich bin gegangen – common in speech. Past perfect (Plusquamperfekt): Ich war gegangen – an action before another past event.',tip:'Movement verbs often use sein. For correction tasks, enter the complete sentence.'},
 uk:{title:'Три минулі часи',body:'Präteritum: Ich ging — часто в оповіданнях. Perfekt: Ich bin gegangen — часто в розмові. Plusquamperfekt: Ich war gegangen — дія відбулася раніше за іншу минулу подію.',tip:'Дієслова руху часто вживаються з sein. У завданнях на виправлення запишіть ціле речення.'},
 ru:{title:'Три прошедших времени',body:'Präteritum: Ich ging — часто в рассказах. Perfekt: Ich bin gegangen — часто в разговоре. Plusquamperfekt: Ich war gegangen — действие произошло раньше другого события в прошлом.',tip:'Глаголы движения часто употребляются с sein. При исправлении напишите предложение целиком.'},
 mk:{title:'Три минати времиња',body:'Präteritum: Ich ging — често во раскажување. Perfekt: Ich bin gegangen — често во говор. Plusquamperfekt: Ich war gegangen — дејство што се случило пред друго минато дејство.',tip:'Глаголите за движење често се употребуваат со sein. При исправка напишете ја целата реченица.'},
 fr:{title:'Les trois temps du passé',body:'Präteritum : Ich ging — fréquent dans les récits. Perfekt : Ich bin gegangen — fréquent à l’oral. Plusquamperfekt : Ich war gegangen — action antérieure à une autre action passée.',tip:'Les verbes de déplacement utilisent souvent sein. Pour les corrections, écrivez toute la phrase.'},
 tr:{title:'Üç geçmiş zaman',body:'Präteritum: Ich ging — hikâyelerde yaygın. Perfekt: Ich bin gegangen — konuşmada yaygın. Plusquamperfekt: Ich war gegangen — geçmişte başka bir olaydan önce gerçekleşen eylem.',tip:'Hareket fiilleri çoğunlukla sein ile kullanılır. Düzeltmelerde tüm cümleyi yazın.'}
};
function norm(s){return String(s).toLocaleLowerCase('de-DE').trim().replace(/[.!?„“"']/g,'').replace(/\s+/g,' ')}
function toggleDragon(){dragonOpen=!dragonOpen;let p=$('dragonPanel');p.classList.toggle('show',dragonOpen);if(dragonOpen)renderDragon()}
function renderDragon(){let tr=translations[language];$('dragonPanel').innerHTML=`<h3>🐉 Fynn, dein Grammatik-Drache</h3><p>„Keine Angst vor den Zeitformen! Ich helfe dir.“</p><label>Erklärungssprache: <select id="langSel" onchange="language=this.value;renderDragon()">${[['de','Deutsch'],['en','English'],['uk','Українська'],['ru','Русский'],['mk','Македонски'],['fr','Français'],['tr','Türkçe']].map(([code,name])=>`<option value="${code}" ${language===code?'selected':''}>${name}</option>`).join('')}</select></label><h3>${tr.title}</h3><p>${tr.body}</p><p>💡 ${tr.tip}</p>${currentTask?`<p><b>Hinweis zur aktuellen Aufgabe:</b> ${currentTask.ex}</p>`:''}<button onclick="toggleDragon()">Schließen</button>`}
function obstacleDraw(o){if(o.done)return;let x=o.x-cam;if(x<-130||x>W+140)return;g.save();g.translate(x,FLOOR);
if(o.kind==='river'){g.fillStyle='#2c8eb1';g.beginPath();g.moveTo(-37,4);g.lineTo(37,4);g.lineTo(37,125);g.lineTo(-37,125);g.fill();for(let j=0;j<6;j++){g.strokeStyle='#b8f5ffb0';g.lineWidth=3;g.beginPath();g.moveTo(-28,20+j*17);g.quadraticCurveTo(0+Math.sin(t*3+j)*12,10+j*17,28,20+j*17);g.stroke()}line(-40,3,40,3,'#f5dbaf',4)}
if(o.kind==='tree'){line(-50,-6,45,-52,'#61402d',22);line(-50,-6,45,-52,'#a47b51',11);for(let j=0;j<6;j++)circle(20+j*9,-59+j%3*12,18,j%2?'#477d45':'#6c9b4d')}
if(o.kind==='stone'){poly([[-42,0],[-33,-54],[-4,-81],[30,-61],[43,-9],[27,0]],'#78818a','#48535c',6);for(let j=0;j<3;j++)circle(-17+j*15,-40+j*4,4,'#a6d9dd');glow(0,-42,75,'#9b86f533')}
text(o.kind==='river'?'🌊 FLUSS':o.kind==='tree'?'🌳 BAUM':'🪨 FELS',0,-110,18,'#ffde95');g.restore()}
function showField(o){activeObstacle=o;currentTask=fieldTasks[o.id];attempts=0;mode='field';keys.left=keys.right=keys.jump=false;hero.vx=0;renderField()}
function renderField(feedback=''){let q=currentTask,box=$('challenge');let typeLabel={choice:'Wähle die richtige Form',write:'Schreibe die richtige Form',fix:'Korrigiere den Fehler'}[q.type];let controls=q.type==='choice'?q.opts.map((a,i)=>`<button class="choice" onclick="submitField(${i})">${String.fromCharCode(65+i)} · ${a}</button>`).join(''):`<input id="fieldInput" type="text" autocomplete="off" spellcheck="false" placeholder="${q.type==='fix'?'Ganzen Satz eingeben':'Antwort eingeben'}" onkeydown="if(event.key==='Enter'){event.preventDefault();submitField()}"/><button class="primary" onclick="submitField()">✓ Prüfen</button>`;
box.innerHTML=`<div class="tag">HINDERNIS ${activeObstacle.id+1}/30 · ${typeLabel}</div><h3>${activeObstacle.kind==='river'?'🌊 Brücke bauen':activeObstacle.kind==='tree'?'🌳 Weg freimachen':'🪨 Felsen verzaubern'}</h3><p>${q.q}</p>${controls}<div id="fieldFeedback">${feedback}</div><p class="small">🐉 Der Drache hilft unten rechts · Erklärungssprachen freiwillig</p>`;box.classList.add('show');if(q.type!=='choice'&&document.activeElement?.tagName!=='BUTTON'){} }
function submitField(i){if(mode!=='field')return;let q=currentTask,raw=q.type==='choice'?q.opts[i]:$('fieldInput').value;let ok=norm(raw)===norm(q.a);attempts++;if(ok){score+=Math.max(25,100-(attempts-1)*25);streak++;activeObstacle.done=true;emit(activeObstacle.x,FLOOR-75,22,'#aaf8ce');$('fieldFeedback').innerHTML='<p style="color:#a7ffca"><b>✨ Richtig! Der Weg ist frei.</b></p>';mode='fieldSolved';$('challenge').querySelectorAll('button,input').forEach(el=>el.disabled=true);$('fieldFeedback').insertAdjacentHTML('beforeend','<button class="primary" onclick="resumeField()">▶ Weiterlaufen</button>');hud()}else{streak=0;hud();$('fieldFeedback').innerHTML=`<p style="color:#ffc1b7">Noch nicht richtig. Versuch es erneut! ${attempts>=2?`<br><b>Tipp:</b> ${q.ex}`:''}</p>`;if(q.type!=='choice')$('fieldInput').focus()}}

function emit(x,y,n,col){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-90,90),vy:rnd(-170,-30),life:rnd(.4,1.1),max:1.1,color:col,r:rnd(2,6)})}
function update(dt){t+=dt;if(mode!=='play')return;
let axis=Number(keys.right)-Number(keys.left),acc=hero.grounded?1600:1000;
hero.vx+=axis*acc*dt;if(!axis)hero.vx*=Math.exp(-11*dt);hero.vx=clamp(hero.vx,-275,275);
if(axis)hero.face=axis;
if(keys.jump&&hero.grounded){hero.vy=-560;hero.grounded=false;emit(hero.x,hero.y+65,7,'#c3d8b6')}
let prevFeet=hero.y+hero.h;hero.vy+=1350*dt;hero.x=clamp(hero.x+hero.vx*dt,25,LEVEL-50);hero.y+=hero.vy*dt;hero.grounded=false;
if(hero.vy>=0){for(let p of platforms){if(prevFeet<=p.y+8&&hero.y+hero.h>=p.y&&hero.x+20>p.x&&hero.x-20<p.x+p.w){hero.y=p.y-hero.h;hero.vy=0;hero.grounded=true;break}}}
if(hero.y+hero.h>=FLOOR){hero.y=FLOOR-hero.h;hero.vy=0;hero.grounded=true}
for(let o of obstacles){if(o.done)continue;let stop=o.x-67;if(hero.x>=stop&&hero.x<o.x+25&&hero.vx>0){hero.x=stop;hero.vx=0;showField(o);break}}
cam+=(clamp(hero.x-W*.32,0,LEVEL-W)-cam)*Math.min(1,dt*5);
for(let c of collectibles){if(!c.got&&Math.abs(c.x-hero.x)<31&&Math.abs(c.y-(hero.y+33))<54){c.got=true;coins++;score+=10;emit(c.x,c.y,10,'#ffe398');hud()}}
let gate=gates[gateIndex];if(mode==='play'&&gate&&Math.abs(hero.x-gate.x)<56&&Math.abs(hero.y+hero.h-FLOOR)<80){mode='quiz';keys.left=keys.right=keys.jump=false;openQuiz()}
particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=230*dt;p.life-=dt}
}

for(let p of platforms)drawPlatform(p);

gates.forEach(portal);for(let o of obstacles)obstacleDraw(o);
for(let d of dust){let x=d.x-cam;if(x<0||x>W)continue;circle(x+Math.sin(t+d.phase)*6,d.y+Math.sin(t*.8+d.phase)*11,d.r,'#ffedb455')}

function show(html){panel.innerHTML=html;veil.classList.remove('hidden')}function hide(){veil.classList.add('hidden')}
function menu(){mode='menu';show(`<div class="tag">ZEITREISE · ENGINE 6.0</div><h2>Das Dorf der Zeiten</h2><p>Reise durch ein lebendiges Fantasy-Dorf, überwinde 30 Hindernisse mit Aufgaben direkt im Spielfeld und öffne zehn magische Grammatik-Tore. Trainiere <b>Präteritum, Perfekt und Plusquamperfekt</b> mit Auswahl, Schreiben und Fehlerkorrektur. 🐉 Fynn erklärt dir die Grammatik in sieben Sprachen.</p><div class="row"><button class="primary" onclick="start('normal')">⚔️ Abenteuer starten</button><button class="primary" onclick="start('hard')">🔥 Schwer</button></div><p class="small">Bewegung: A/D oder Pfeiltasten · Springen: Leertaste · Mobil: Bildschirmtasten</p>`)}
function start(diff){difficulty=diff;gateIndex=0;score=0;coins=0;streak=0;answers=[];cam=0;hero.x=120;hero.y=FLOOR-70;hero.vx=hero.vy=0;gates.forEach(x=>x.done=false);obstacles.forEach(x=>x.done=false);activeObstacle=null;currentTask=null;$('challenge').classList.remove('show');collectibles.forEach(x=>x.got=false);particles=[];hud();mode='play';hide()}
function shuffle(a){return a.map(x=>({x,k:Math.random()})).sort((a,b)=>a.k-b.k).map(o=>o.x)}
let current=null,options=[];

function openQuiz(){current=examples[gateIndex];options=makeOptions(current);let type=gateIndex%3;let controls=type===0?options.map((x,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)} · ${x}</button>`).join(''):`<input id="gateInput" style="width:100%;padding:12px;border-radius:10px;font-size:18px" placeholder="${type===1?'Richtige Form eingeben':'Fehler korrigieren: richtige Form eingeben'}" onkeydown="if(event.key==='Enter')answer(-1)"/><button class="primary" onclick="answer(-1)">Antwort prüfen</button>`;

function answer(i){if(mode!=='quiz')return;let type=gateIndex%3,picked=type===0?options[i]:$('gateInput').value,ok=norm(picked)===norm(current.a);answers.push({gate:gateIndex+1,question:current.q,chosen:picked,correct:current.a,ok});score+=ok?(difficulty==='hard'?170:120)+streak*20:20;streak=ok?streak+1:0;gates[gateIndex].done=true;
document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(options[j]===current.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});if($('gateInput'))$('gateInput').disabled=true;
panel.insertAdjacentHTML('beforeend',`<p style="color:${ok?'#a2f4b6':'#ffb2a7'}"><b>${ok?'✨ Richtig!':'📖 Noch nicht ganz.'}</b> Richtige Antwort: <b>${current.a}</b>.</p><button class="primary" onclick="continueGame()">${gateIndex===9?'🏆 Ergebnis ansehen':'✨ Weiterreisen'}</button>`);mode='feedback';hud();emit(gates[gateIndex].x,FLOOR-100,35,ok?'#b1ffdc':'#ffdd99')}

function setKey(k,on){if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=on;if(k==='ArrowRight'||k==='d'||k==='D')keys.right=on;if(k===' '||k==='ArrowUp'||k==='w'||k==='W')keys.jump=on}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();setKey(e.key,true)});
document.addEventListener('keyup',e=>setKey(e.key,false));window.addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false});
for(let [id,k] of [['left','left'],['right','right'],['jump','jump']]){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)}
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());
menu();hud();requestAnimationFrame(frame);
