
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZEITREISE – Das Dorf der Zeiten</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101a36;
  color: #f8f0dc;
  font: 16px system-ui, Arial;
}

button, select {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  background: #152546;
  border-bottom: 2px solid #c59a50;
}

header b {
  font: 900 22px Georgia;
  color: #ffe1a2;
}

.pill {
  border: 1px solid #8aa2bf;
  background: #223c62;
  border-radius: 25px;
  padding: 7px 12px;
  font-size: 13px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 12px;
}

h1, h2 {
  font-family: Georgia;
  color: #ffe1a2;
}

h1 {
  font-size: clamp(30px, 6vw, 52px);
  margin: 10px 0;
}

p {
  line-height: 1.5;
}

.panel {
  background: linear-gradient(150deg, #2c4569, #172745);
  border: 1px solid #8ba4c3;
  border-radius: 18px;
  padding: 17px;
  margin: 12px 0;
  box-shadow: 0 8px 24px #0004;
}

.btn {
  background: linear-gradient(#ffecba, #e8ad54);
  color: #39260c;
  border: 2px solid #fff3c6;
  border-radius: 12px;
  padding: 11px 17px;
  font-weight: 800;
  margin: 4px;
  box-shadow: 0 3px #90622a;
}

.btn.alt {
  background: #315477;
  color: #fff;
  border-color: #9bb9d4;
  box-shadow: 0 3px #193754;
}

.btn:disabled {
  opacity: .5;
}

#stage {
  position: relative;
  overflow: hidden;
  border: 3px solid #c8a46b;
  border-radius: 16px;
  box-shadow: 0 8px 25px #0008;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: none;
  background: #75c7eb;
}

.hud {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  gap: 5px;
  pointer-events: none;
}

.hud span {
  background: #152b50d9;
  padding: 7px 10px;
  border-radius: 14px;
  font-size: clamp(10px, 2.5vw, 14px);
  font-weight: 800;
  box-shadow: 0 2px 6px #0005;
}

.controlbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin: 12px 0;
}

.pad {
  display: flex;
  gap: 8px;
}

.pad button {
  font-size: 24px;
  min-width: 70px;
  min-height: 56px;
  background: #244b7c;
  color: #fff;
  border: 2px solid #9bc4eb;
  border-radius: 15px;
  touch-action: none;
}

.tip {
  font-size: 13px;
  color: #c8d7e9;
}

.overlay {
  position: absolute;
  inset: 0;
  background: #0c1938c9;
  display: grid;
  place-items: center;
  padding: 12px;
}

.question {
  width: min(96%, 680px);
  background: #fff2d5;
  color: #32291e;
  border: 4px solid #a86d37;
  border-radius: 20px;
  padding: 16px;
  box-shadow: 0 14px 40px #0009;
  text-align: center;
}

.question h2 {
  color: #794519;
  margin: 6px;
}

.choices {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.choices button {
  background: #d7e9f7;
  border: 2px solid #6699c0;
  color: #183a5a;
  border-radius: 12px;
  padding: 13px 7px;
  font-weight: 800;
  overflow-wrap: anywhere;
  min-height: 54px;
}

.choices button:active {
  background: #a3d8ec;
}

.tiny {
  font-size: 12px;
  opacity: .8;
}

.scoregrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.scoregrid div {
  background: #1b3455;
  border-radius: 13px;
  padding: 12px;
  text-align: center;
}

.scoregrid strong {
  display: block;
  font-size: 27px;
  color: #ffe1a2;
}

.review {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.review td, .review th {
  border-bottom: 1px solid #547194;
  padding: 9px 5px;
  text-align: left;
  vertical-align: top;
}

.bad {
  color: #ffb6ae;
}

.good {
  color: #9ff0bc;
}

.bubble {
  background: #fff1d4;
  color: #322a21;
  border-radius: 17px;
  padding: 16px;
  min-height: 112px;
  line-height: 1.6;
  white-space: pre-line;
}

.mentor {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

.mentor .avatar {
  font-size: 64px;
}

.translate {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid #8ea8c9;
  border-radius: 12px;
}

.translate summary {
  cursor: pointer;
  font-weight: 700;
}

.translate select {
  margin: 10px 0;
  padding: 10px;
  max-width: 100%;
  border-radius: 8px;
}

.translate article {
  white-space: pre-line;
  line-height: 1.55;
}

.hidden {
  display: none !important;
}

@media (max-width: 540px) {
  main {
    padding: 7px;
  }

  .panel {
    padding: 12px;
  }

  .hud span {
    padding: 5px;
  }

  .mentor .avatar {
    font-size: 42px;
  }

  .choices button {
    font-size: 13px;
  }
}
</style>
</head>
<body>

<header>
  <b>⏳ ZEITREISE</b>
  <span class="pill" id="topScore">⭐ 0</span>
</header>

<main id="app"></main>

<script>
  
const V = [
  ['machen','machte','hat gemacht','hatte gemacht'],
  ['gehen','ging','ist gegangen','war gegangen'],
  ['sehen','sah','hat gesehen','hatte gesehen'],
  ['kommen','kam','ist gekommen','war gekommen'],
  ['schreiben','schrieb','hat geschrieben','hatte geschrieben'],
  ['lernen','lernte','hat gelernt','hatte gelernt'],
  ['fahren','fuhr','ist gefahren','war gefahren'],
  ['essen','aß','hat gegessen','hatte gegessen'],
  ['sprechen','sprach','hat gesprochen','hatte gesprochen'],
  ['bringen','brachte','hat gebracht','hatte gebracht'],
  ['finden','fand','hat gefunden','hatte gefunden'],
  ['arbeiten','arbeitete','hat gearbeitet','hatte gearbeitet'],
  ['bleiben','blieb','ist geblieben','war geblieben'],
  ['nehmen','nahm','hat genommen','hatte genommen'],
  ['trinken','trank','hat getrunken','hatte getrunken'],
  ['denken','dachte','hat gedacht','hatte gedacht'],
  ['kaufen','kaufte','hat gekauft','hatte gekauft'],
  ['lesen','las','hat gelesen','hatte gelesen'],
  ['schlafen','schlief','hat geschlafen','hatte geschlafen'],
  ['helfen','half','hat geholfen','hatte geholfen']
];

const FORMS = [
  '',
  'Präteritum',
  'Perfekt',
  'Plusquamperfekt'
];

const app = document.getElementById('app');

let mode = 'easy';
let g = null;
let raf = 0;
let keys = {left:false,right:false};
let last = 0;
let typeTimer = null;

const WIDTH = 960;
const HEIGHT = 500;
const WORLD = 5200;

const gates = [
  540,1020,1500,1980,2460,
  2940,3420,3900,4380,4850
];

let stored = {best:0};

try {
  stored = JSON.parse(
    localStorage.getItem('zeitreise_dorf_v1')
  ) || stored;
} catch(e) {}

document.getElementById('topScore').textContent =
  '🏆 Rekord ' + (stored.best || 0);

const R = (a,b) => Math.random()*(b-a)+a;

function shuffle(a) {
  a = [...a];
  for(let i=a.length-1;i>0;i--) {
    let j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function stop() {
  cancelAnimationFrame(raf);
  clearInterval(typeTimer);
  raf = 0;
  g = null;
  keys.left = false;
  keys.right = false;
}

function home() {
  stop();

  app.innerHTML = `
  <section class="panel">
    <h1>🏰 Das Dorf der Zeiten</h1>

    <p>
      Eine zusammenhängende, scrollende Fantasy-Mission.
      Laufe durch das Dorf, öffne zehn magische Tore
      und erreiche das Zeitportal.
    </p>

    <p>
      🎮 <b>Steuerung:</b> ◀ ▶ oder A/D.
      Auf dem Smartphone die Pfeiltasten gedrückt halten.
      Vor einem Tor erscheint die Aufgabe direkt
      über der Spielwelt.
    </p>

    <p><b>Schwierigkeitsgrad</b></p>

    <label>
      <input type="radio" name="mode"
        value="easy" checked>
      Einfach – deutlich verschiedene Antworten
    </label>

    <p>
      <label>
        <input type="radio" name="mode"
          value="hard">
        Schwierig – ähnliche Zeitformen
        und erfundene Verbformen
      </label>
    </p>

    <button class="btn" id="begin">
      ▶ Mission beginnen
    </button>

    <p class="tip">
      Keine harte Zeitbegrenzung.
      Schnelle Antworten und Serien geben Bonuspunkte.
      Nach der Mission gibt es eine Fehleranalyse
      und freiwillige Übersetzungen ohne Flaggen.
    </p>
  </section>`;

  document.getElementById('begin').onclick = () => {
    mode = document.querySelector(
      'input[name="mode"]:checked'
    ).value;
    start();
  };
}

function fake(v,form) {
  let s = v[form];
  let opts = [];

  if(form===3) {
    opts.push(v[2],v[1]);
    opts.push(
      s.replace(/^hatte /,'hat ')
       .replace(/^war /,'ist ')
    );
  } else if(form===2) {
    opts.push(v[1],v[3]);
    opts.push(
      s.replace(/^hat /,'ist ')
       .replace(/^ist /,'hat ')
    );
  } else {
    opts.push(v[2],v[3]);
    opts.push(
      v[1].replace(/a/g,'ä').replace(/i/g,'ie')
    );
  }

  let stem = v[0].replace(/en$/,'');

  opts.push(
    'hat ge'+stem+'t',
    'ist ge'+stem+'en',
    v[1]+'te'
  );

  return [...new Set(opts)].filter(x=>x!==s);
}

function task(n) {
  let v = V[(n*7+3)%V.length];
  let f = 1+(n%3);
  let correct = v[f];
  let pool;

  if(mode==='hard') {
    pool = [
      ...fake(v,f),
      ...shuffle(V.filter(x=>x!==v)).map(x=>x[f])
    ];
  } else {
    pool = shuffle(V.filter(x=>x!==v))
      .map(x=>x[1+(n+1)%3]);

    pool.push(v[(f%3)+1]);
  }

  pool = [...new Set(pool)]
    .filter(x=>x!==correct);

  let options = shuffle([
    correct,
    ...pool.slice(0,3)
  ]);

  return {v,f,correct,options};
}

function start() {
  stop();

  g = {
    x:70,
    y:0,
    cam:0,
    step:0,
    score:0,
    streak:0,
    bestStreak:0,
    results:[],
    paused:false,
    question:null,
    qStart:0,
    particles:[],
    walk:0,
    elapsed:0
  };

  app.innerHTML = `
  <div id="stage">
    <canvas
      id="scene"
      width="960"
      height="500"
      aria-label="Seitlich scrollendes Fantasy-Dorf">
    </canvas>

    <div class="hud">
      <span id="progress">🏰 Tor 0/10</span>
      <span id="streak">🔥 Serie 0</span>
      <span id="score">⭐ 0</span>
    </div>

    <div id="overlay" class="overlay hidden"></div>
  </div>

  <div class="controlbar">
    <div class="pad">
      <button id="left" aria-label="Links">◀</button>
      <button id="right" aria-label="Rechts">▶</button>
    </div>

    <span class="tip">
      Halte ▶ gedrückt · Tastatur: A / D
    </span>

    <button class="btn alt" id="exit">
      Beenden
    </button>
  </div>`;

  let canvas = document.getElementById('scene');

  g.c = canvas;
  g.ctx = canvas.getContext('2d');

  canvas.addEventListener('pointerdown',e=>{
    if(!g||g.paused)return;

    let b = canvas.getBoundingClientRect();
    let x = (e.clientX-b.left)*WIDTH/b.width;

    keys.left = x<WIDTH/2;
    keys.right = !keys.left;

    canvas.setPointerCapture(e.pointerId);
  });

  ['pointerup','pointercancel','lostpointercapture']
    .forEach(ev=>canvas.addEventListener(ev,()=>{
      keys.left = keys.right = false;
    }));

  ['left','right'].forEach(k=>{
    let b = document.getElementById(k);

    b.addEventListener('pointerdown',e=>{
      e.preventDefault();
      keys[k] = true;
      b.setPointerCapture(e.pointerId);
    });

    ['pointerup','pointercancel','lostpointercapture']
      .forEach(ev=>b.addEventListener(ev,()=>{
        keys[k] = false;
      }));
  });

  document.getElementById('exit').onclick = home;

  last = performance.now();
  raf = requestAnimationFrame(loop);
}

function path(fn) {
  let c = g.ctx;
  c.beginPath();
  fn(c);
  c.fill();
}

function fill(color) {
  g.ctx.fillStyle = color;
}

function box(x,y,w,h,color) {
  fill(color);
  g.ctx.fillRect(x,y,w,h);
}

function circle(x,y,r,color) {
  fill(color);
  g.ctx.beginPath();
  g.ctx.arc(x,y,r,0,Math.PI*2);
  g.ctx.fill();
}

function poly(points,color) {
  fill(color);
  path(c=>{
    c.moveTo(...points[0]);
    for(let p of points.slice(1)) {
      c.lineTo(...p);
    }
    c.closePath();
  });
}

function line(x,y,x2,y2,color,width=2) {
  let c = g.ctx;
  c.strokeStyle = color;
  c.lineWidth = width;
  c.beginPath();
  c.moveTo(x,y);
  c.lineTo(x2,y2);
  c.stroke();
}

function label(s,x,y,size=20,color='#fff') {
  let c = g.ctx;
  c.fillStyle = color;
  c.font = `bold ${size}px system-ui`;
  c.textAlign = 'center';
  c.fillText(s,x,y);
}

function scenery() {
  let c = g.ctx;
  let t = g.elapsed;
  let cam = g.cam;

  let sky = c.createLinearGradient(0,0,0,500);
  sky.addColorStop(0,'#5cb8e7');
  sky.addColorStop(.7,'#b7e7ef');
  sky.addColorStop(1,'#e8f1c4');

  box(0,0,WIDTH,HEIGHT,sky);

  circle(790,83,48,'#ffe9a1');

  for(let i=0;i<12;i++) {
    let x = (i*220-cam*.15+2500)%2500-150;
    let y = 75+(i%4)*30;

    circle(x,y,25,'#ffffffb5');
    circle(x+30,y-10,34,'#ffffffb5');
    circle(x+62,y,25,'#ffffffb5');
  }

  for(let i=0;i<16;i++) {
    let x = i*170-(cam*.28%170);

    poly([
      [x-150,350],
      [x+20,170+(i%3)*24],
      [x+190,350]
    ],'#7cbbba');
  }

  for(let i=0;i<20;i++) {
    let x = i*110-(cam*.55%110);

    circle(x,357,72,'#5eaa7c');
    circle(x+45,357,53,'#4d986f');
  }

  box(0,400,WIDTH,100,'#65934f');
  box(0,407,WIDTH,15,'#a6b86b');

  for(let i=0;i<70;i++) {
    let x = (i*87-cam%87+WIDTH)%WIDTH;
    let y = 430+(i%4)*16;

    circle(x,y,3,'#d8c889');
  }

  for(let i=0;i<15;i++) {
    let x = i*400-cam*.8;

    if(x>-100&&x<WIDTH+100) {
      box(x,335,12,70,'#805a39');
      circle(x+6,315,39,'#377d53');
      circle(x-17,328,29,'#438d5a');
      circle(x+28,327,27,'#4b985f');
    }
  }
}

function house(x,n) {
  let c = g.ctx;

  x -= g.cam;

  if(x<-230||x>WIDTH+220)return;

  let y = 402;
  let w = 170;
  let h = 145+(n%3)*17;

  box(x-w/2,y-h,w,h,'#f5d5a0');

  poly([
    [x-w/2-20,y-h],
    [x,y-h-88],
    [x+w/2+20,y-h]
  ],'#a84c39');

  box(x-w/2+15,y-h+18,34,48,'#795338');
  box(x+w/2-49,y-h+18,34,48,'#795338');

  box(x-w/2+21,y-h+24,22,36,'#a8dff2');
  box(x+w/2-43,y-h+24,22,36,'#a8dff2');

  box(x-24,y-77,48,77,'#74472f');

  line(x-w/2,y-h,x+w/2,y,'#8b5a38',8);
  line(x+w/2,y-h,x-w/2,y,'#8b5a38',8);

  box(x-w/2,y-15,w,15,'#bb8b59');
}

function gate(x,n) {
  x -= g.cam;

  if(x<-130||x>WIDTH+140)return;

  let locked = n>=g.step;

  box(x-46,255,92,150,'#6c4d63');
  box(x-35,267,70,138,locked?'#423b62':'#63bca7');

  poly([
    [x-62,255],
    [x,194],
    [x+62,255]
  ],'#a45a5a');

  box(x-50,252,100,13,'#e8bf79');

  label(
    locked?'🔒':'✓',
    x,325,31,
    locked?'#ffdf83':'#c6ffe1'
  );

  label('TOR '+(n+1),x,233,17,'#fff1ba');
}

function player() {
  let x = g.x-g.cam;
  let y = 392;
  let bounce = Math.sin(g.walk*12)*3;

  circle(x,y-105+bounce,21,'#efb886');

  poly([
    [x-28,y-126+bounce],
    [x,y-175+bounce],
    [x+28,y-126+bounce]
  ],'#6545a6');

  box(x-26,y-85+bounce,52,69,'#7253b6');

  line(x-15,y-15,x-20,y+13,'#45345b',9);
  line(x+15,y-15,x+20,y+13,'#45345b',9);

  circle(x-7,y-109+bounce,2,'#362b3d');
  circle(x+7,y-109+bounce,2,'#362b3d');

  line(x+28,y-68,x+43,y-40,'#efb886',9);
}

function render() {
  scenery();

  for(let i=0;i<11;i++) {
    house(180+i*450,i);
  }

  for(let i=0;i<gates.length;i++) {
    gate(gates[i],i);
  }

  player();

  if(g.step===10) {
    let x = 5090-g.cam;

    circle(x,295,80,'#8a5ce888');
    circle(x,295,58,'#d5b8ff');
    circle(x,295,39,'#6e54c9');

    label('ZEITPORTAL',x,185,20);
  }
}

function loop(now) {
  if(!g)return;

  let dt = Math.min(.04,(now-last)/1000||.016);
  last = now;

  g.elapsed += dt;

  if(!g.paused) {
    let move =
      (keys.right?1:0)-(keys.left?1:0);

    let nextX = g.x+move*245*dt;

    if(g.step<gates.length) {
      nextX = Math.min(nextX,gates[g.step]-55);
    }

    g.x = Math.max(45,Math.min(WORLD-60,nextX));

    if(move)g.walk += dt;

    g.cam = Math.max(
      0,
      Math.min(WORLD-WIDTH,g.x-300)
    );

    if(g.step<gates.length &&
       g.x>=gates[g.step]-56) {
      showQuestion();
    }

    if(g.step===10&&g.x>=5040) {
      finish();
      return;
    }
  }

  render();
  raf = requestAnimationFrame(loop);
} 
// ===========================================
// TEIL 3 – TORE, PUNKTE UND GRAMMATIKDRACHE
// ===========================================

// Tastatursteuerung
document.addEventListener('keydown', e => {
  if (!g || g.paused) return;

  const k = e.key.toLowerCase();

  if (k === 'arrowleft' || k === 'a') {
    keys.left = true;
    e.preventDefault();
  }

  if (k === 'arrowright' || k === 'd') {
    keys.right = true;
    e.preventDefault();
  }
});

document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();

  if (k === 'arrowleft' || k === 'a') {
    keys.left = false;
  }

  if (k === 'arrowright' || k === 'd') {
    keys.right = false;
  }
});

window.addEventListener('blur', () => {
  keys.left = false;
  keys.right = false;
});

// ===========================================
// GRAMMATIKAUFGABEN
// ===========================================

function showQuestion() {
  if (!g || g.paused) return;

  g.paused = true;
  keys.left = false;
  keys.right = false;

  const q = task(g.step);

  g.question = q;
  g.qStart = performance.now();

  const overlay = document.getElementById('overlay');

  overlay.classList.remove('hidden');

  overlay.innerHTML = `
    <div class="question">
      <div class="tiny">
        🗝️ MAGISCHES TOR ${g.step + 1} VON 10
      </div>

      <h2>Welche Form ist richtig?</h2>

      <p>
        Gesucht:
        <b>${FORMS[q.f]}</b>
      </p>

      <h2 style="font-size:32px">
        ${esc(q.v[0])}
      </h2>

      <div class="choices">
        ${q.options.map((a,i) => `
          <button data-answer="${i}">
            ${esc(a)}
          </button>
        `).join('')}
      </div>

      <p class="tiny">
        ⚡ Schnell antworten = mehr Punkte.
        Keine Zeitbegrenzung!
      </p>
    </div>
  `;

  overlay.querySelectorAll('[data-answer]')
    .forEach(b => {
      b.onclick = () => {
        answer(Number(b.dataset.answer));
      };
    });
}

function answer(index) {
  if (!g || !g.paused || !g.question) return;

  const q = g.question;

  const chosen = q.options[index];
  const correct = chosen === q.correct;

  const seconds =
    (performance.now() - g.qStart) / 1000;

  let base = 0;
  let speed = 0;
  let combo = 0;

  if (correct) {
    base = 100;

    // Maximal 1000 Geschwindigkeitspunkte.
    // Nach 20 Sekunden gibt es keinen
    // Geschwindigkeitsbonus mehr.
    speed = Math.max(
      0,
      Math.round(1000 * (1 - seconds / 20))
    );

    g.streak++;

    // Jede richtige Antwort in Folge
    // erhöht den Serienbonus.
    combo = Math.min(
      500,
      Math.max(0, (g.streak - 1) * 75)
    );

    g.bestStreak = Math.max(
      g.bestStreak,
      g.streak
    );

    g.score += base + speed + combo;
  } else {
    g.streak = 0;
  }

  g.results.push({
    verb: q.v[0],
    form: FORMS[q.f],
    chosen,
    correctAnswer: q.correct,
    correct,
    seconds,
    base,
    speed,
    combo,
    points: base + speed + combo
  });

  g.step++;
  g.question = null;

  document.getElementById('progress').textContent =
    '🏰 Tor ' + g.step + '/10';

  document.getElementById('streak').textContent =
    '🔥 Serie ' + g.streak;

  document.getElementById('score').textContent =
    '⭐ ' + g.score.toLocaleString('de-DE');

  const overlay = document.getElementById('overlay');

  overlay.innerHTML = `
    <div class="question">
      <h2>${correct ? '🌟 RICHTIG!' : '💫 KNAPP DANEBEN!'}</h2>

      <p>
        ${correct
          ? 'Das magische Tor öffnet sich!'
          : 'Die richtige Form lautet:'}
      </p>

      <h2>${esc(q.correct)}</h2>

      <p>
        ${correct
          ? `+${base} Grundpunkte<br>
             +${speed} Tempobonus<br>
             +${combo} Serienbonus`
          : 'Beim nächsten Tor klappt es bestimmt!'}
      </p>

      <button class="btn" id="continue">
        Weiterlaufen ➜
      </button>
    </div>
  `;

  document.getElementById('continue').onclick = () => {
    overlay.classList.add('hidden');
    g.paused = false;
  };
}

schreiben – schrieb – geschrieben.

Öneri: Mastar, Präteritum ve Partizip II biçimlerini birlikte öğrenin. Sonra yardımcı fiilleri ekleyin.`,

`Perfekt, haben veya sein yardımcı fiili ve Partizip II ile oluşturulur.

Fiillerin çoğu haben kullanır:
"Ich habe gelesen."

Yer değiştirme veya durum değişikliği bildiren birçok fiil sein kullanır:
"Ich bin gegangen."
"Sie ist eingeschlafen."

Plusquamperfekt biçiminde hatte ve war kullanılır.

Öneri: Yardımcı fiili her zaman Partizip II ile birlikte öğrenin.`,

`1. Kelime kartları kullanın: ön tarafa mastarı, arka tarafa geçmiş zaman biçimlerini yazın.

2. Kendi örnek cümlelerinizi oluşturun.

3. Düzenli tekrar yapın: bugün, yarın, üç gün sonra ve gelecek hafta.

4. Benzer biçimlere sahip fiilleri gruplandırın.

5. Fiil biçimlerini yüksek sesle söyleyin.

6. Özellikle yanlış cevapladığınız fiilleri tekrar edin.

Her gün on dakika çalışmak, haftada bir kez uzun süre çalışmaktan genellikle daha yararlıdır.`
  ]
};

// ===========================================
// MISSIONSENDE UND AUSWERTUNG
// ===========================================

function finish() {
  if (!g) return;

  const results = [...g.results];
  const score = g.score;
  const bestStreak = g.bestStreak;

  const right = results.filter(x => x.correct).length;
  const wrong = results.length - right;

  const base = results.reduce((s,x) => s+x.base,0);
  const speed = results.reduce((s,x) => s+x.speed,0);
  const combo = results.reduce((s,x) => s+x.combo,0);

  const avg = results.length
    ? results.reduce((s,x) => s+x.seconds,0)/results.length
    : 0;

  if (score > (stored.best || 0)) {
    stored.best = score;

    try {
      localStorage.setItem(
        'zeitreise_dorf_v1',
        JSON.stringify(stored)
      );
    } catch(e) {}
  }

  stop();

  document.getElementById('topScore').textContent =
    '🏆 Rekord ' + stored.best.toLocaleString('de-DE');

  const accuracy = results.length
    ? Math.round(right/results.length*100)
    : 0;

  const rows = results.map((r,i) => `
    <tr>
      <td>${i+1}. ${esc(r.verb)}<br>
        <small>${esc(r.form)}</small>
      </td>
      <td class="${r.correct?'good':'bad'}">
        ${esc(r.chosen)}
      </td>
      <td class="good">
        ${esc(r.correctAnswer)}
      </td>
      <td>
        ${r.correct?'✓':'✗'}<br>
        +${r.points}
      </td>
    </tr>
  `).join('');

  app.innerHTML = `
  <section class="panel">
    <h1>🏆 Mission geschafft!</h1>

    <p>
      Du hast das Dorf durchquert und alle zehn
      magischen Tore geöffnet!
    </p>

    <div class="scoregrid">
      <div>
        <strong>${score.toLocaleString('de-DE')}</strong>
        Punkte
      </div>

      <div>
        <strong>${right}/10</strong>
        Richtig
      </div>

      <div>
        <strong>${accuracy}%</strong>
        Trefferquote
      </div>

      <div>
        <strong>${wrong}</strong>
        Fehler
      </div>

      <div>
        <strong>${bestStreak}</strong>
        Beste Serie
      </div>

      <div>
        <strong>${avg.toFixed(1)} s</strong>
        Ø Antwortzeit
      </div>
    </div>

    <h2>⭐ Deine Punkte im Detail</h2>

    <p>Grundpunkte: <b>${base}</b></p>
    <p>Geschwindigkeitsbonus: <b>${speed}</b></p>
    <p>Serienbonus: <b>${combo}</b></p>

    <h2>📋 Alle Antworten</h2>

    <div style="overflow-x:auto">
      <table class="review">
        <thead>
          <tr>
            <th>Aufgabe</th>
            <th>Deine Antwort</th>
            <th>Richtige Lösung</th>
            <th>Punkte</th>
          </tr>
        </thead>

        <tbody>${rows}</tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>🐉 Professor Flämmchen erklärt</h2>

    <div class="mentor">
      <div class="avatar">🐉</div>

      <div style="flex:1;min-width:0">
        <h3 id="lessonTitle"></h3>

        <div class="bubble" id="bubble"></div>

        <button class="btn alt" id="skipText">
          Text vollständig zeigen
        </button>

        <button class="btn" id="nextLesson">
          Nächster Tipp ➜
        </button>
      </div>
    </div>

    <details class="translate">
      <summary>
        🌐 Möchtest du die Erklärung übersetzen?
        Hier klicken.
      </summary>

      <p class="tiny">
        Die Übersetzung ist freiwillig.
        Die Grammatikaufgaben bleiben auf Deutsch.
      </p>

      <select id="language">
        <option value="">Sprache wählen</option>
        ${Object.entries(LANGUAGES).map(([id,name])=>`
          <option value="${id}">${name}</option>
        `).join('')}
      </select>

      <article id="translated"></article>
    </details>
  </section>

  <section class="panel">
    <h2>🗺️ Deine nächste Zeitreise</h2>

    <p>
      Die erste Mission ist abgeschlossen.
      Die nächsten Welten werden später ergänzt.
    </p>

    <button class="btn" id="replay">
      🔁 Dorf erneut spielen
    </button>

    <button class="btn alt" id="menu">
      🏠 Zum Hauptmenü
    </button>
  </section>
  `;

  document.getElementById('replay').onclick = start;
  document.getElementById('menu').onclick = home;

  initMentor();
}

// ===========================================
// ANIMIERTER GRAMMATIKDRACHE
// ===========================================

let lessonIndex = 0;
let charIndex = 0;
let typing = false;

function initMentor() {
  lessonIndex = 0;

  document.getElementById('skipText').onclick = () => {
    showAllText();
  };

  document.getElementById('nextLesson').onclick = () => {
    lessonIndex = (lessonIndex+1)%LESSONS.length;
    displayLesson();
  };

  document.getElementById('language').onchange = () => {
    showTranslation();
  };

  displayLesson();
}

function displayLesson() {
  clearInterval(typeTimer);

  const lesson = LESSONS[lessonIndex];

  document.getElementById('lessonTitle').textContent =
    lesson.title;

  document.getElementById('bubble').textContent = '';

  charIndex = 0;
  typing = true;

  showTranslation();

  typeTimer = setInterval(() => {
    const bubble = document.getElementById('bubble');

    if (!bubble) {
      clearInterval(typeTimer);
      return;
    }

    // Zwei Zeichen pro Durchlauf.
    charIndex = Math.min(
      lesson.de.length,
      charIndex+2
    );

    bubble.textContent =
      lesson.de.slice(0,charIndex);

    if (charIndex >= lesson.de.length) {
      clearInterval(typeTimer);
      typing = false;
    }
  },25);
}

function showAllText() {
  clearInterval(typeTimer);
  typing = false;

  const bubble = document.getElementById('bubble');

  if (bubble) {
    bubble.textContent = LESSONS[lessonIndex].de;
  }
}

function showTranslation() {
  const select = document.getElementById('language');
  const article = document.getElementById('translated');

  if (!select || !article) return;

  const lang = select.value;

  if (!lang || !TRANSLATIONS[lang]) {
    article.textContent = '';
    return;
  }

  article.textContent =
    TRANSLATIONS[lang][lessonIndex] || '';
}

// ===========================================
// SPIEL STARTEN
// ===========================================

home();

</script>
