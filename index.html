function rnd(n) {
  let v=Math.sin(n*127.1+41.73)*43758.5453;
  return v-Math.floor(v);
}
function rect(x,y,w,h,c) {
  ctx.fillStyle=c;
  ctx.fillRect(x,y,w,h);
}
function circle(x,y,r,c) {
  ctx.fillStyle=c;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}
function stroke(x,y,x2,y2,c,w=2) {
  ctx.strokeStyle=c;
  ctx.lineWidth=w;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}
function poly(points,c) {
  ctx.fillStyle=c;
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  points.slice(1).forEach(p=>ctx.lineTo(...p));
  ctx.closePath();
  ctx.fill();
}
function round(x,y,w,h,r,c) {
  ctx.fillStyle=c;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}
function text(s,x,y,size=18,c='#fff',align='center') {
  ctx.textAlign=align;
  ctx.font=`900 ${size}px Georgia`;
  ctx.lineWidth=3;
  ctx.strokeStyle='#1b253580';
  ctx.strokeText(s,x,y);
  ctx.fillStyle=c;
  ctx.fillText(s,x,y);
}

// ==========================================
// SVG-ZEICHENFUNKTION
// ==========================================

function drawArt(name,x,y,w,h,flip=false) {
  const im=art[name];

  if(!im||!im.complete||!im.naturalWidth)return;

  ctx.save();

  if(flip) {
    ctx.translate(x+w,y);
    ctx.scale(-1,1);
    ctx.drawImage(im,0,0,w,h);
  } else {
    ctx.drawImage(im,x,y,w,h);
  }

  ctx.restore();
}

// ==========================================
// HINTERGRUND
// ==========================================

function cloud(x,y,s=1) {
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);

  circle(-40,7,27,'#ffffffa8');
  circle(-10,-9,40,'#ffffffe0');
  circle(28,-3,34,'#ffffffd5');
  circle(54,10,22,'#ffffffad');

  ctx.restore();
}

function mountain(x,y,s,c) {
  poly([
    [x-230*s,H],
    [x,y],
    [x+250*s,H]
  ],c);

  poly([
    [x-43*s,y+52*s],
    [x,y],
    [x+55*s,y+70*s],
    [x+15*s,y+58*s],
    [x-12*s,y+81*s]
  ],'#f5f5e5a8');
}

function background() {
  const cam=state?.cam||0;

  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#4ca9dc');
  sky.addColorStop(.55,'#a6dff1');
  sky.addColorStop(1,'#f8e5a7');

  rect(0,0,W,H,sky);

  circle(907,114,64,'#fff3c4');

  for(let i=0;i<17;i++) {
    let x=(i*265-cam*.12)%(W+500);
    if(x< -170)x+=W+500;

    cloud(
      x,
      88+(i%5)*32,
      .55+rnd(i)*.65
    );
  }

  for(let i=0;i<13;i++) {
    mountain(
      i*320-cam*.18,
      300+rnd(i)*100,
      .85+rnd(i+3)*.35,
      i%2?'#8bb9bf':'#a3caca'
    );
  }

  for(let i=0;i<14;i++) {
    circle(
      i*245-cam*.37,
      465,
      165,
      i%2?'#75aa8a':'#8dbb96'
    );
  }
}

function drawVillage() {
  const cam=state?.cam||0;

  // Hintere Baumreihe
  for(let i=0;i<33;i++) {
    let x=i*225-cam*.67;

    if(x>-160&&x<W+160) {
      const scale=.68+rnd(i+4)*.34;

      drawArt(
        'tree',
        x-95*scale,
        FLOOR-320*scale,
        190*scale,
        320*scale
      );
    }
  }

  // Fachwerkhäuser und Marktstände
  for(let i=0;i<18;i++) {
    const x=160+i*420-cam;

    if(x>-350&&x<W+350) {
      if(i%4===2) {
        drawArt(
          'tower',
          x-130,
          FLOOR-345,
          260,
          345
        );
      } else {
        drawArt(
          'house',
          x-150,
          FLOOR-315,
          300,
          315
        );
      }

      if(i%3===1) {
        drawArt(
          'market',
          x+120,
          FLOOR-190,
          245,
          190
        );
      }
    }
  }

  // Boden
  rect(0,FLOOR,W,H-FLOOR,'#6d9c59');
  rect(0,FLOOR,W,13,'#b8ca80');
  rect(0,FLOOR+16,W,12,'#a9875d');

  // Pflastersteine
  for(
    let i=Math.floor(cam/46)-1;
    i<Math.ceil((cam+W)/46)+1;
    i++
  ) {
    const x=i*46-cam;

    round(
      x+3,FLOOR+30,42,30,5,
      i%2?'#bca07c':'#d0b48d'
    );

    stroke(
      x+3,FLOOR+60,
      x+44,FLOOR+60,
      '#80694f',2
    );

    if(i%3===0) {
      circle(x+8,FLOOR-4,4,'#f5c2d5');
      circle(x+11,FLOOR-11,3,'#fce4aa');
    }
  }
}

  for(let i=0;i<w/32;i++) {

      x+i*32,y+10,30,14,

function drawCoin(x,y,t) {
  const xx=x-state.cam;

  if(xx<-30||xx>W+30)return;

  const bob=Math.sin(t*3+x)*5;

  circle(xx,y+bob,16,'#9d641c');

  circle(xx,y+bob,9,'#e7ad34');

  text('✦',xx,y+5+bob,16,'#fff3bd');

function drawGate(x,i) {
  const xx=x-state.cam;

  if(xx<-120||xx>W+120)return;

  const open=i<state.gate;

  drawArt(
    'gate',
    xx-88,
    FLOOR-280,
    176,
    280

  if(open) {
    round(
      xx-40,
      FLOOR-192,
      80,
      177,
      18,
      '#63e3b08c'
    );

    text('✓',xx,FLOOR-100,47,'#e7ffbe');

  text(
    'TOR '+(i+1),
    xx,FLOOR-288,19,
    '#fff3c5'
  );
}

function drawHero() {
  const x=state.x-state.cam;
  const y=state.y;

  const moving=Math.abs(state.vx)>20;
  const bob=moving
    ?Math.sin(state.time*13)*3
    :Math.sin(state.time*2)*1;

  drawArt(
    'hero',
    x-37,
    y-95+bob,
    74,
    96,
    state.dir<0

}

function foreground() {
  const cam=state.cam;

  // Zäune
  for(let i=0;i<12;i++) {
    const x=430+i*600-cam;

    if(x>-100&&x<W+100) {

    const x=p.x-cam;

    if(x>-p.w&&x<W) {
      drawPlatform(x,p.y,p.w);
    }

  // Grammatik-Tore
  for(let i=0;i<GATE_X.length;i++) {
    drawGate(GATE_X[i],i);

  // Zielportal
  const ex=endX-cam;

  if(ex>-140&&ex<W+140) {
    circle(ex,FLOOR-114,96,'#6549c6a6');

      ex,FLOOR-224,24,

  // Münzen
  for(const c of state.coins) {
    if(!c.taken) {
      drawCoin(c.x,c.y,state.time);

  }
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function shuffle(a) {
  a=[...a];

  for(let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

      w:165
    });
  }

  const coins=[];

  for(let i=0;i<48;i++) {
    coins.push({
      x:320+i*136,
      y:FLOOR-65-(i%4)*32,
      taken:false
    });
  }

  state={
    x:110,
    y:FLOOR-24,
    vx:0,
    vy:0,
    dir:1,
    grounded:true,
    cam:0,

    bestCombo:0,
    collected:0,
    time:0,
    paused:false,
    question:null,
    results:[],
    platforms,
    coins,

    noticeUntil:0

  keys.right=false;
  keys.jump=false;

function makeQuestion(n) {
  const verb=verbs[n%verbs.length];
  const form=1+n%3;
  const correct=verb[form];

  let wrong=[];

  if(mode==='easy') {
    wrong=shuffle(
      verbs.filter(v=>v!==verb)
    ).map(v=>v[form]);
  } else {
    // Andere Zeitformen desselben Verbs
    wrong=[
      verb[1],
      verb[2],
      verb[3]
    ].filter(x=>x!==correct);

    // Zusätzliche falsche Verbformen
    const stem=verb[0].replace(/en$/,'');

    wrong.push(
      'hat ge'+stem+'t',
      'ist ge'+stem+'t',
      stem+'te',
      'hatte ge'+stem+'t'
    );
  }

  wrong=[...new Set(wrong)]
    .filter(x=>x!==correct);

  // Immer vier Antwortmöglichkeiten
  for(const v of shuffle(verbs)) {
    if(wrong.length>=3)break;

    const candidate=v[form];

    if(
      candidate!==correct &&
      !wrong.includes(candidate)
    ) {
      wrong.push(candidate);
    }
  }

  return {
    verb:verb[0],
    form,
    correct,
    choices:shuffle([
      correct,
      ...wrong.slice(0,3)
    ])
  };
}

function openQuestion() {
  if(!state||state.paused)return;

  state.paused=true;

  keys.left=false;
  keys.right=false;
  keys.jump=false;

  const q=makeQuestion(state.gate);
  state.question=q;
  questionStart=performance.now();

  showPanel(`
    <div class="sub">
      🗝️ MAGISCHES TOR ${state.gate+1}/10
    </div>

    <h2>Welche Form ist richtig?</h2>

    <p>

    </p>

    <h1>${escapeHTML(q.verb)}</h1>

    <div class="answers">
      ${q.choices.map((a,i)=>`
        <button data-choice="${i}">
          ${escapeHTML(a)}
        </button>
      `).join('')}
    </div>

    <p class="sub">
      ⚡ Je schneller, desto mehr Punkte.
      Ohne Zeitdruck!
    </p>
  `);

  panel.querySelectorAll('[data-choice]')
    .forEach(b=>{
      b.onclick=()=>submitAnswer(
        Number(b.dataset.choice)
      );
    });
}

function submitAnswer(index) {
  if(!state||!state.question)return;

  const q=state.question;
  const chosen=q.choices[index];
  const correct=chosen===q.correct;

  const seconds=
    (performance.now()-questionStart)/1000;

  let base=0;
  let speed=0;
  let comboBonus=0;

  if(correct) {
    base=100;

    speed=Math.max(
      0,
      Math.round(1000*(1-seconds/20))
    );

    state.combo++;

    comboBonus=Math.min(
      500,
      (state.combo-1)*75
    );

    state.bestCombo=Math.max(
      state.bestCombo,
      state.combo
    );
  } else {
    state.combo=0;
  }

  const earned=base+speed+comboBonus;

  state.score+=earned;

  state.results.push({
    verb:q.verb,
    form:forms[q.form],
    chosen,
    correct:q.correct,
    right:correct,
    seconds,
    base,
    speed,
    comboBonus,
    earned
  });

  state.gate++;
  state.question=null;

  updateHUD();

  showPanel(`
    <h1>
      ${correct?'🌟 Richtig!':'📖 Fast geschafft!'}
    </h1>

    <p>
      Die richtige Form ist:
    </p>

    <h2>${escapeHTML(q.correct)}</h2>

    <p>
      ${correct
        ? `Grundpunkte: +${base}<br>
           Tempobonus: +${speed}<br>
           Serienbonus: +${comboBonus}`
        : 'Beim nächsten Tor geht es weiter!'}
    </p>

    <button id="continueButton">
      Weiter ➜
    </button>
  `);

  document.getElementById('continueButton')
    .onclick=()=>{
      hidePanel();
      state.paused=false;
    };
}

// ==========================================
// PHYSIK UND SPIELSCHLEIFE
// ==========================================

function tick(now) {
  if(!state)return;

  const dt=Math.min(
    .035,
    Math.max(0,(now-previous)/1000)
  );

  previous=now;

  if(!state.paused) {
    state.time+=dt;

    const direction=
      (keys.right?1:0)-(keys.left?1:0);

    state.vx=direction*290;

    if(direction!==0) {
      state.dir=direction;
    }

    if(keys.jump&&state.grounded) {
      state.vy=-650;
      state.grounded=false;
    }

    const oldFeet=state.y+24;

    state.vy+=1500*dt;
    state.x+=state.vx*dt;
    state.y+=state.vy*dt;

    state.x=Math.max(
      40,
      Math.min(WORLD-50,state.x)
    );

    // Boden
    if(state.y+24>=FLOOR) {
      state.y=FLOOR-24;
      state.vy=0;
      state.grounded=true;
    } else {
      state.grounded=false;

      // Plattformkollision
      for(const p of state.platforms) {
        const feet=state.y+24;

        if(
          state.vy>=0 &&
          oldFeet<=p.y+8 &&
          feet>=p.y &&
          state.x+17>p.x &&
          state.x-17<p.x+p.w
        ) {
          state.y=p.y-24;
          state.vy=0;
          state.grounded=true;
          break;
        }
      }
    }

    // Münzen
    for(const coin of state.coins) {
      if(coin.taken)continue;

      const dx=state.x-coin.x;
      const dy=(state.y-40)-coin.y;

      if(dx*dx+dy*dy<43*43) {
        coin.taken=true;
        state.collected++;
        state.score+=25;

        state.notice='🪙 +25 Punkte';
        state.noticeUntil=state.time+.8;

        updateHUD();
      }
    }

    // Grammatik-Tore
    if(state.gate<GATE_X.length) {
      const limit=GATE_X[state.gate]-62;

      if(state.x>=limit) {
        state.x=limit;
        state.vx=0;

        openQuestion();
      }
    }

    // Kamera
    const desired=Math.max(
      0,
      Math.min(WORLD-W,state.x-W*.34)
    );

    state.cam+=(desired-state.cam)*
      Math.min(1,dt*7);

    // Missionsende
    if(
      state.gate===10 &&
      state.x>=endX-50
    ) {
      finishGame();
      return;
    }
  }

  render();
  raf=requestAnimationFrame(tick);
}

// ==========================================
// IPHONE-STEUERUNG
// ==========================================

function bindControl(id,key) {
  const b=document.getElementById(id);

  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    keys[key]=true;

    try {
      b.setPointerCapture(e.pointerId);
    } catch(err) {}
  });

  const release=e=>{
    e.preventDefault();
    keys[key]=false;
  };

  b.addEventListener('pointerup',release);
  b.addEventListener('pointercancel',release);

  b.addEventListener('lostpointercapture',()=>{
    keys[key]=false;
  });

  b.addEventListener('contextmenu',e=>{
    e.preventDefault();
  });

  b.addEventListener('selectstart',e=>{
    e.preventDefault();
  });
}

bindControl('left','left');
bindControl('right','right');
bindControl('jump','jump');

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();

  if(
    ['arrowleft','arrowright',' ','arrowup']
      .includes(k)
  ) {
    e.preventDefault();
  }

  if(k==='arrowleft'||k==='a') {
    keys.left=true;
  }

  if(k==='arrowright'||k==='d') {
    keys.right=true;
  }

  if(k===' '||k==='arrowup'||k==='w') {
    keys.jump=true;
  }
});

document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();

  if(k==='arrowleft'||k==='a') {
    keys.left=false;
  }

  if(k==='arrowright'||k==='d') {
    keys.right=false;
  }

  if(k===' '||k==='arrowup'||k==='w') {
    keys.jump=false;
  }
});

window.addEventListener('blur',()=>{
  keys.left=false;
  keys.right=false;
  keys.jump=false;
});

// iOS-Kontextmenü unterdrücken
for(const id of ['frame','controls']) {
  const el=document.getElementById(id);

  el.addEventListener('contextmenu',e=>{
    e.preventDefault();
  });

  el.addEventListener('selectstart',e=>{
    e.preventDefault();
  });
}

// ==========================================
// MISSIONSENDE UND AUSWERTUNG
// ==========================================

function finishGame() {
  if(!state)return;

  cancelAnimationFrame(raf);
  clearInterval(typingTimer);

  const data=[...state.results];

  const score=state.score;
  const collected=state.collected;
  const bestCombo=state.bestCombo;

  const correct=data.filter(r=>r.right).length;
  const wrong=data.length-correct;

  const base=data.reduce(
    (s,r)=>s+r.base,0
  );

  const speed=data.reduce(
    (s,r)=>s+r.speed,0
  );

  const combo=data.reduce(
    (s,r)=>s+r.comboBonus,0
  );

  const average=data.length
    ?data.reduce(
      (s,r)=>s+r.seconds,0
    )/data.length
    :0;

  state.paused=true;

  showPanel(`
    <h1>🏆 Mission geschafft!</h1>

    <p>
      Du hast alle zehn magischen Tore
      geöffnet und das Zeitportal erreicht!
    </p>

    <div class="result">
      <div>
        <strong>${score.toLocaleString('de-DE')}</strong>
        Punkte
      </div>

      <div>
        <strong>${correct}/10</strong>
        Richtig
      </div>

      <div>
        <strong>${collected}</strong>
        Münzen
      </div>

      <div>
        <strong>${wrong}</strong>
        Fehler
      </div>

      <div>
        <strong>${bestCombo}</strong>
        Beste Serie
      </div>

      <div>
        <strong>${average.toFixed(1)} s</strong>
        Ø Antwortzeit
      </div>
    </div>

    <h2>Deine Punkte</h2>

    <p>
      Grundpunkte: ${base}<br>
      Tempobonus: ${speed}<br>
      Serienbonus: ${combo}<br>
      Münzen: ${collected*25}
    </p>

    <h2>📋 Deine Antworten</h2>

    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Verb / Zeit</th>
            <th>Deine Antwort</th>
            <th>Richtig</th>
          </tr>
        </thead>

        <tbody>
          ${data.map(r=>`
            <tr>
              <td>
                ${escapeHTML(r.verb)}<br>
                <small>${escapeHTML(r.form)}</small>
              </td>

              <td class="${r.right?'good':'bad'}">
                ${escapeHTML(r.chosen)}
              </td>

              <td>
                ${escapeHTML(r.correct)}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    <h2>🐉 Professor Flämmchen</h2>

    <p id="lessonTitle"></p>

    <div class="text" id="lessonText"></div>

    <button class="secondary" id="showAll">
      Text vollständig anzeigen
    </button>

    <button id="nextTip">
      Nächster Lerntipp ➜
    </button>

    <details>
      <summary>
        🌐 Übersetzung benötigt?
      </summary>

      <p class="sub">
        Nur die Erklärung wird übersetzt,
        nicht die Aufgaben.
      </p>

      <select id="language">
        <option value="">Sprache auswählen</option>
        <option value="uk">Українська</option>
        <option value="ru">Русский</option>
        <option value="mk">Македонски</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="tr">Türkçe</option>
      </select>

      <p class="text" id="translation"></p>
    </details>

    <p>
      <button id="restart">
        🔁 Erneut spielen
      </button>

      <button class="secondary" id="home">
        🏠 Hauptmenü
      </button>
    </p>
  `);

  document.getElementById('restart')
    .onclick=startGame;

  document.getElementById('home')
    .onclick=menu;

  setupLessons();
}

// ==========================================
// GRAMMATIKDRACHE
// ==========================================

let lesson=0;

function setupLessons() {
  lesson=0;

  document.getElementById('nextTip')
    .onclick=()=>{
      lesson=(lesson+1)%explanations.length;
      displayLesson();
    };

  document.getElementById('showAll')
    .onclick=()=>{
      clearInterval(typingTimer);

      document.getElementById('lessonText')
        .textContent=explanations[lesson][1];
    };

  document.getElementById('language')
    .onchange=displayTranslation;

  displayLesson();
}

function displayLesson() {
  clearInterval(typingTimer);

  const [title,body]=explanations[lesson];

  document.getElementById('lessonTitle')
    .textContent='🐉 '+title;

  const el=document.getElementById('lessonText');
  el.textContent='';

  let index=0;

  typingTimer=setInterval(()=>{
    if(!el.isConnected) {
      clearInterval(typingTimer);
      return;
    }

    index=Math.min(body.length,index+2);
    el.textContent=body.slice(0,index);

    if(index>=body.length) {
      clearInterval(typingTimer);
    }
  },24);

  displayTranslation();
}

function displayTranslation() {
  const select=document.getElementById('language');
  const target=document.getElementById('translation');

  if(!select||!target)return;

  const lang=select.value;

  target.textContent=
    lang&&translations[lang]
      ?translations[lang][lesson]
      :'';
}

// ==========================================
// SPIEL STARTEN
// ==========================================

menu();

</script>
